        // ==========================================
        // 26. SALVAR COLABORADOR - CORRIGIDO
        // ==========================================
        async function salvarColaborador() {
            if (!currentUser) {
                showToast('Usuário não autenticado. Faça login novamente.', 'error');
                return;
            }

            const botao = document.getElementById('btnSalvarColaborador');
            const id = document.getElementById('colaboradorId')?.value || null;
            const nome = document.getElementById('colabNome')?.value?.trim() || '';

            if (!nome) {
                showToast('Digite o nome do colaborador.', 'error');
                document.getElementById('colabNome')?.focus();
                return;
            }

            // Validar campos obrigatórios
            const manualPercent = Number(document.getElementById('colabManualPercent')?.value || 0);
            const productPercent = Number(document.getElementById('colabProductPercent')?.value || 0);
            
            if (manualPercent < 0 || manualPercent > 100) {
                showToast('A porcentagem de serviços manuais deve estar entre 0 e 100.', 'error');
                return;
            }
            
            if (productPercent < 0 || productPercent > 100) {
                showToast('A porcentagem de serviços com produtos deve estar entre 0 e 100.', 'error');
                return;
            }

            // Preparar os dados
            const dados = {
                name: nome,
                specialty: document.getElementById('colabEspecialidade')?.value || '',
                contact: document.getElementById('colabContato')?.value || '',
                email: document.getElementById('colabEmail')?.value || '',
                description: document.getElementById('colabDescricao')?.value || '',
                manualPercent: manualPercent,
                productPercent: productPercent,
                baseSalary: Number(document.getElementById('colabBaseSalary')?.value || 0),
                paymentDay: Number(document.getElementById('colabPaymentDay')?.value || 5),
                active: document.getElementById('colabActive')?.checked !== false,
                photoUrl: colaboradorAtual?.photoUrl || null,
                portfolio: Array.isArray(portfolioFotos) ? [...portfolioFotos] : [],
                userId: currentUser.uid,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (botao) {
                    botao.disabled = true;
                    botao.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Salvando...';
                }

                let docRef;
                if (id) {
                    // Atualizar colaborador existente
                    docRef = db.collection('collaborators').doc(id);
                    await docRef.set(dados, { merge: true });
                } else {
                    // Criar novo colaborador
                    dados.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    docRef = await db.collection('collaborators').add(dados);
                }

                // Atualizar o objeto local
                const salvo = {
                    ...(colaboradorAtual || {}),
                    ...dados,
                    id: docRef.id || id
                };
                colaboradorAtual = salvo;
                isEditando = false;

                // Atualizar a lista local
                if (docRef.id || id) {
                    atualizarColaboradorLocal(docRef.id || id, {
                        ...dados,
                        id: docRef.id || id
                    });
                }

                // Re-renderizar a lista
                renderizarColaboradores();

                // Fechar o modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('colaboradorModal'));
                if (modal) modal.hide();

                showToast(id ? 'Colaborador atualizado com sucesso!' : 'Colaborador criado com sucesso!', 'success');

            } catch (error) {
                console.error('❌ ERRO AO SALVAR COLABORADOR:', error);
                showToast('Erro ao salvar no Firestore: ' + obterMensagemErro(error), 'error');
            } finally {
                if (botao) {
                    botao.disabled = false;
                    botao.innerHTML = '<i class="fas fa-save me-1"></i>Salvar';
                }
            }
        }

        function atualizarColaboradorLocal(id, alteracoes) {
            const index = colaboradoresList.findIndex(c => c.id === id);
            if (index === -1) {
                // Se não encontrou, adicionar
                colaboradoresList.push({
                    id: id,
                    ...alteracoes
                });
            } else {
                colaboradoresList[index] = { ...colaboradoresList[index], ...alteracoes };
            }
            ordenarColaboradores();
            renderizarColaboradores();
        }

        function ordenarColaboradores() {
            colaboradoresList.sort((a, b) => {
                const ativoA = a.active !== false ? 0 : 1;
                const ativoB = b.active !== false ? 0 : 1;
                if (ativoA !== ativoB) return ativoA - ativoB;
                return (a.name || '').localeCompare(b.name || '', 'pt-PT', { sensitivity: 'base' });
            });
        }

        function obterMensagemErro(error) {
            if (!error) return 'erro desconhecido';
            const code = error.code ? ` [${error.code}]` : '';
            return `${error.message || String(error)}${code}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ==========================================
        // 27. EXCLUIR COLABORADOR
        // ==========================================
        function excluirColaborador(colaboradorId) {
            Swal.fire({
                title: 'Tem certeza?',
                text: 'Esta ação não pode ser desfeita. O colaborador será removido permanentemente.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, excluir!',
                cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    showToast('Excluindo colaborador...', 'info');

                    db.collection('collaborators').doc(colaboradorId).delete()
                        .then(() => {
                            const modal = bootstrap.Modal.getInstance(document.getElementById('colaboradorModal'));
                            if (modal) modal.hide();
                            showToast('Colaborador excluído com sucesso!', 'success');
                            carregarColaboradores();
                        })
                        .catch(error => {
                            console.error('Erro ao excluir colaborador:', error);
                            showToast('Erro ao excluir colaborador: ' + error.message, 'error');
                        });
                }
            });
        }

        // ==========================================
        // 28. FUNÇÕES DE BUSCA E FILTRO
        // ==========================================
        document.getElementById('searchColaborador')?.addEventListener('input', function() {
            searchTerm = this.value;
            renderizarColaboradores();
        });

        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                renderizarColaboradores();
            });
        });

        // ==========================================
        // 29. FUNÇÕES DE NAVEGAÇÃO
        // ==========================================
        function goHome() {
            try {
                window.parent.postMessage({ action: 'goHome' }, '*');
            } catch(e) {
                window.location.href = 'layout-index.html';
            }
        }

        function recarregarColaboradores() {
            carregarTodosOsDados();
            showToast('Dados recarregados!', 'success');
        }

        // ==========================================
        // 30. FUNÇÕES AUXILIARES
        // ==========================================
        function formatCurrency(value) {
            if (typeof value !== 'number') value = parseFloat(value) || 0;
            return '€ ' + value.toFixed(2).replace('.', ',');
        }

        function showToast(message, type = 'info') {
            if (typeof Swal !== 'undefined') {
                const icons = {
                    'success': 'success',
                    'error': 'error',
                    'warning': 'warning',
                    'info': 'info'
                };
                Swal.fire({
                    icon: icons[type] || 'info',
                    title: message,
                    timer: 3000,
                    showConfirmButton: false,
                    toast: true,
                    position: 'top-end',
                    timerProgressBar: true
                });
            } else {
                console.log(`[${type.toUpperCase()}] ${message}`);
            }
        }

        function atualizarUltimaAtualizacao() {
            const now = new Date();
            const el = document.getElementById('lastUpdateBadge');
            if (el) {
                el.innerHTML = `<i class="fas fa-clock me-1"></i>Atualizado ${now.toLocaleTimeString('pt-PT')}`;
            }
        }

        function mostrarLoginPrompt() {
            Swal.fire({
                title: 'Acesso Restrito',
                text: 'Faça login para gerenciar colaboradores.',
                icon: 'warning',
                confirmButtonText: 'Ir para Login',
                showCancelButton: true,
                cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    window.location.href = '/login.html';
                }
            });
        }

        // ==========================================
        // 31. EXPOR FUNÇÕES GLOBAIS
        // ==========================================
        window.goHome = goHome;
        window.recarregarColaboradores = recarregarColaboradores;
        window.abrirPerfilColaborador = abrirPerfilColaborador;
        window.editarColaborador = editarColaborador;
        window.excluirColaborador = excluirColaborador;
        window.abrirModalNovoColaborador = abrirModalNovoColaborador;
        window.uploadFotoPerfil = uploadFotoPerfil;
        window.removerFotoPerfil = removerFotoPerfil;
        window.removerFotoPortfolio = removerFotoPortfolio;
        window.editarLegendaFoto = editarLegendaFoto;
        window.visualizarFotoPortfolio = visualizarFotoPortfolio;
        window.setPeriod = setPeriod;
        window.aplicarPeriodo = aplicarPeriodo;
        window.limparPeriodo = limparPeriodo;
        window.aoAlterarDataPeriodo = aoAlterarDataPeriodo;

        // ==========================================
        // 32. LOG DE INICIALIZAÇÃO
        // ==========================================
        console.log('✅ Colaboradores carregado com sucesso!');
        console.log('📌 Funcionalidades:');
        console.log('   - Estatísticas com dados REAIS do sistema');
        console.log('   - Período: Hoje, Semana, Mês, Último Mês, Ano');
        console.log('   - Botão Aplicar na cor VERDE');
        console.log('   - Período NÃO recarrega a página - APENAS atualiza estatísticas');
        console.log('   - Bloqueio de deslize lateral em mobile');
        console.log('   - Portfólio com upload funcional');
        console.log('   - Upload de foto de perfil funcionando');
        console.log('   - Botão Salvar funcionando corretamente');

    </script>
