<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colaboradores - Studio DeVitto</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <!-- Cloudinary SDK -->
    <script src="https://upload-widget.cloudinary.com/global.js"></script>
    
    <style>
        /* ============================================
           BLOQUEIO DE DESLIZE LATERAL - REFORÇADO
           ============================================ */
        html, body {
            overflow-x: hidden !important;
            max-width: 100vw !important;
            width: 100% !important;
            position: relative !important;
        }
        
        * {
            overflow-x: hidden !important;
            max-width: 100% !important;
        }
        
        .colaborador-card {
            overflow: hidden !important;
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }
        
        .colaborador-card * {
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }
        
        .collaborators-content {
            overflow-x: hidden !important;
            max-width: 100% !important;
        }
        
        .row {
            margin-left: 0 !important;
            margin-right: 0 !important;
        }
        
        .col-lg-4, .col-md-6, .col-12 {
            padding-left: 8px !important;
            padding-right: 8px !important;
        }
        
        .modal {
            overflow-x: hidden !important;
        }
        
        .modal-body {
            overflow-x: hidden !important;
        }
        
        .modal-dialog {
            max-width: 100% !important;
            margin: 0 !important;
        }
        
        /* ============================================
           VARIÁVEIS DINÂMICAS
           ============================================ */
        :root {
            --primary-color: #26196b;
            --secondary-color: #ffd700;
            --accent-color: #4a3a9c;
            --light-bg: #f8f9fa;
            --card-radius: 12px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --btn-border-radius: 8px;
            --btn-padding: 8px 20px;
            --font-size-base: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--light-bg);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-size: var(--font-size-base);
            overflow-x: hidden !important;
            max-width: 100vw !important;
            width: 100% !important;
            position: relative !important;
        }

        /* ============================================
           CABEÇALHO COM BOTÃO HOME
           ============================================ */
        .collaborators-header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            overflow-x: hidden !important;
        }

        .collaborators-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .collaborators-header .header-left .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .collaborators-header .header-left .brand-logo img {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .collaborators-header .header-left .brand-logo .brand-icon {
            font-size: 1.5rem;
            color: var(--secondary-color);
        }

        .collaborators-header .header-left .brand-logo .brand-name {
            font-weight: 700;
            font-size: 1rem;
            color: white;
        }

        .collaborators-header .header-left .brand-logo .brand-name small {
            font-weight: 400;
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 6px;
        }

        .collaborators-header .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-home {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 25px;
            padding: 6px 14px;
            font-size: 0.8rem;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-home:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .btn-home i {
            font-size: 0.9rem;
        }

        .btn-refresh {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 25px;
            padding: 6px 12px;
            font-size: 0.8rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-refresh:hover {
            background: rgba(255,255,255,0.25);
        }

        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .last-update {
            font-size: 0.65rem;
            opacity: 0.7;
            color: rgba(255,255,255,0.8);
        }

        /* ============================================
           CONTEÚDO PRINCIPAL
           ============================================ */
        .collaborators-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 16px;
            overflow-x: hidden !important;
            max-width: 100% !important;
        }

        /* ============================================
           CARDS DOS COLABORADORES
           ============================================ */
        .colaborador-card {
            background: white;
            border-radius: var(--card-radius);
            overflow: hidden !important;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            height: 100%;
            cursor: pointer;
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
            max-width: 100% !important;
        }

        .colaborador-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .colaborador-card .card-header-custom {
            padding: 12px 14px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden !important;
        }

        .colaborador-card .card-header-custom .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.3);
            margin-bottom: 4px;
        }

        .colaborador-card .card-header-custom .avatar-placeholder {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 4px;
            border: 3px solid rgba(255,255,255,0.2);
        }

        .colaborador-card .card-header-custom .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .colaborador-card .card-header-custom .status-badge.active {
            background: #28a745;
            color: white;
        }

        .colaborador-card .card-header-custom .status-badge.inactive {
            background: #dc3545;
            color: white;
        }

        .colaborador-card .card-header-custom h6 {
            margin: 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .colaborador-card .card-header-custom small {
            opacity: 0.8;
            font-size: 0.65rem;
        }

        .colaborador-card .card-body-custom {
            padding: 10px 14px;
            overflow: hidden !important;
        }

        .colaborador-card .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 0.78rem;
            border-bottom: 1px solid #f0f0f0;
            overflow: hidden !important;
        }

        .colaborador-card .stat-row:last-child {
            border-bottom: none;
        }

        .colaborador-card .stat-row .label {
            color: #6c757d;
        }

        .colaborador-card .stat-row .value {
            font-weight: 600;
        }

        .colaborador-card .stat-row .value.positive {
            color: #28a745;
        }
        .colaborador-card .stat-row .value.salao {
            color: var(--primary-color);
        }
        .colaborador-card .stat-row .value.comissao {
            color: #ffc107;
        }

        .colaborador-card .card-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            padding: 8px 14px 10px;
            border-top: 1px solid #f0f0f0;
            flex-wrap: wrap;
            overflow: hidden !important;
        }

        .colaborador-card .card-actions .btn-sm {
            padding: 4px 10px;
            font-size: 0.7rem;
        }

        .colaborador-card .portfolio-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================
           BOTÃO ADICIONAR
           ============================================ */
        .add-btn-container {
            margin-bottom: 16px;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
        }

        .add-btn-container .btn {
            padding: var(--btn-padding);
            border-radius: var(--btn-border-radius);
            font-size: 0.85rem;
        }

        /* ============================================
           MODAL DO PERFIL DO COLABORADOR - TELA CHEIA
           ============================================ */
        .colaborador-modal .modal-dialog {
            max-width: 100% !important;
            width: 100% !important;
            margin: 0 !important;
        }

        .colaborador-modal .modal-content {
            border-radius: 16px;
            overflow: hidden;
            min-height: 100vh !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
        }

        .colaborador-modal .modal-header {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 24px;
        }

        .colaborador-modal .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }

        .colaborador-modal .modal-body {
            padding: 24px;
            max-height: 80vh;
            overflow-y: auto;
            overflow-x: hidden !important;
        }

        .colaborador-modal .modal-footer {
            border-top: 1px solid #eee;
            padding: 16px 24px;
        }

        /* ============================================
           FORMULÁRIO
           ============================================ */
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #333;
        }

        .form-control,
        .form-select {
            border-radius: var(--btn-border-radius);
            border: 2px solid #e9ecef;
            font-size: 0.9rem;
            padding: 8px 12px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(38,25,107,0.15);
        }

        /* ============================================
           PORTFÓLIO - GRADE DE FOTOS
           ============================================ */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .portfolio-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            transition: all 0.3s;
        }

        .portfolio-item:hover {
            transform: scale(1.03);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .portfolio-item .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .portfolio-item:hover .portfolio-overlay {
            opacity: 1;
        }

        .portfolio-item .portfolio-overlay .btn-sm {
            padding: 2px 6px;
            font-size: 0.6rem;
            border-radius: 4px;
            background: rgba(255,255,255,0.9);
            color: #333;
            border: none;
        }

        .portfolio-item .portfolio-overlay .btn-sm:hover {
            background: white;
        }

        .portfolio-item .portfolio-overlay .btn-sm.danger {
            background: rgba(220,53,69,0.9);
            color: white;
        }

        .portfolio-item .portfolio-overlay .btn-sm.danger:hover {
            background: #dc3545;
        }

        .portfolio-item .portfolio-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(220,53,69,0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .portfolio-item:hover .portfolio-remove {
            opacity: 1;
        }

        .portfolio-item .portfolio-remove:hover {
            background: #dc3545;
            transform: scale(1.1);
        }

        .portfolio-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: #6c757d;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #dee2e6;
        }

        .portfolio-empty i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        /* ============================================
           ESTATÍSTICAS DO COLABORADOR NO MODAL - ATUALIZÁVEL
           ============================================ */
        .colab-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .colab-stat-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .colab-stat-item .stat-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }

        .colab-stat-item .stat-label {
            font-size: 0.65rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .colab-stat-item .stat-number.positive {
            color: #28a745;
        }
        .colab-stat-item .stat-number.comissao {
            color: #ffc107;
        }
        .colab-stat-item .stat-number.salao {
            color: var(--primary-color);
        }
        .colab-stat-item .stat-number.liquido { color: #198754; }

        /* Animação de atualização das estatísticas */
        .stat-updating {
            animation: pulse-update 0.5s ease;
        }

        @keyframes pulse-update {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); background: #e7f1ff; }
            100% { transform: scale(1); }
        }

        /* ============================================
           CALENDÁRIO DE PERÍODO
           ============================================ */
        .period-selector {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border: 1px solid #e9ecef;
        }

        .period-selector .period-label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--primary-color);
        }

        .period-selector .period-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .period-selector .period-inputs input {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.75rem;
            max-width: 120px;
        }

        .period-selector .period-inputs input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(38,25,107,0.15);
        }

        .period-selector .period-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .period-selector .period-buttons button {
            padding: 3px 10px;
            border-radius: 16px;
            border: 1px solid #dee2e6;
            background: #f8f9fa;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .period-selector .period-buttons button:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .period-selector .period-buttons button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Botão Aplicar - COR VERDE */
        .btn-aplicar-periodo {
            background: #28a745 !important;
            border-color: #28a745 !important;
            color: white !important;
            padding: 3px 12px !important;
            font-size: 0.7rem !important;
            border-radius: 16px !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            border: 1px solid #28a745 !important;
        }

        .btn-aplicar-periodo:hover {
            background: #218838 !important;
            border-color: #1e7e34 !important;
        }

        /* ============================================
           RESPONSIVIDADE
           ============================================ */
        @media (max-width: 768px) {
            .collaborators-header {
                padding: 10px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }

            .collaborators-header .header-left {
                gap: 8px;
                flex-wrap: wrap;
            }

            .collaborators-header .header-left .brand-logo .brand-name {
                font-size: 0.85rem;
            }

            .collaborators-header .header-left .brand-logo img {
                height: 28px;
                width: 28px;
            }

            .collaborators-header .header-actions {
                justify-content: flex-start;
            }

            .collaborators-content {
                padding: 8px 10px;
            }

            .colaborador-card .card-header-custom .avatar {
                width: 50px;
                height: 50px;
            }

            .colaborador-card .card-header-custom .avatar-placeholder {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .portfolio-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 6px;
            }

            .colab-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .add-btn-container {
                justify-content: center;
            }

            .btn-home {
                padding: 5px 12px;
                font-size: 0.7rem;
            }

            .btn-refresh {
                padding: 5px 10px;
                font-size: 0.7rem;
            }

            .last-update {
                font-size: 0.55rem;
            }

            .colaborador-modal .modal-dialog {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
            }

            .colaborador-modal .modal-content {
                min-height: 100vh !important;
                max-height: 100vh !important;
                border-radius: 0 !important;
            }

            .colaborador-modal .modal-body {
                padding: 14px;
                max-height: 75vh;
            }

            .period-selector {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 12px;
            }

            .period-selector .period-inputs {
                flex-direction: column;
                align-items: stretch;
            }

            .period-selector .period-inputs input {
                max-width: 100%;
            }

            .period-selector .period-buttons {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .collaborators-header {
                padding: 8px 10px;
            }

            .collaborators-header .header-left .brand-logo .brand-name {
                font-size: 0.75rem;
            }

            .collaborators-header .header-left .brand-logo .brand-name small {
                display: none;
            }

            .collaborators-header .header-left .brand-logo img {
                height: 24px;
                width: 24px;
            }

            .collaborators-content {
                padding: 6px 4px;
            }

            .colaborador-card .card-body-custom {
                padding: 6px 8px;
            }

            .colaborador-card .stat-row {
                font-size: 0.65rem;
            }

            .colaborador-card .card-actions .btn-sm {
                padding: 2px 6px;
                font-size: 0.6rem;
            }

            .colaborador-modal .modal-body {
                padding: 10px;
            }

            .portfolio-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 4px;
            }

            .colab-stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .colab-stat-item {
                padding: 8px 6px;
            }

            .colab-stat-item .stat-number {
                font-size: 1rem;
            }
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* ============================================
           UTILITÁRIOS
           ============================================ */
        .text-primary-custom {
            color: var(--primary-color);
        }
        .bg-primary-custom {
            background: var(--primary-color);
        }
        .border-primary-custom {
            border-color: var(--primary-color);
        }
        .cursor-pointer {
            cursor: pointer;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-3 {
            gap: 12px;
        }
        .gap-4 {
            gap: 16px;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .align-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 16px;

        /* ============================================

            display: inline-block;
            width: 26px;
            height: 26px;
            border: 3px solid rgba(38,25,107,0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================
           SISTEMA DE BUSCA
           ============================================ */
        .search-container {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-container input {
            padding-left: 36px;
            border-radius: 25px;
            background: white;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(38,25,107,0.15);
        }

        .search-container .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);

        /* ============================================
           BOTÃO DE FILTRO
           ============================================ */
        .filter-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;

        .filter-buttons .btn-filter {
            padding: 4px 14px;
            border-radius: 20px;

            cursor: pointer;
            transition: all 0.2s;

        .filter-buttons .btn-filter.active {
            background: var(--primary-color);

        /* ============================================
           BOTÃO DE UPLOAD DE FOTOS
           ============================================ */
        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f0f0ff;
        }

        .upload-area i {
            font-size: 2rem;
            color: #adb5bd;
            margin-bottom: 8px;
        }

        .upload-area p {
            margin: 0;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .upload-area .btn-upload {
            margin-top: 10px;
        }

        /* ============================================
           TOAST / NOTIFICAÇÃO
           ============================================ */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            z-index: 9999;
            font-weight: 500;
            box-shadow: var(--shadow-md);

        .toast-notification.error {

        .toast-notification.info {
            background: #17a2b8;
        }

        .toast-notification.warning {
            background: #ffc107;
            color: #000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }

        /* ============================================

        .container, .container-fluid, .row, .col-*, .col-lg-*, .col-md-*, .col-sm-* {

        .modal-open .modal {

        }

        .modal-open body {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
        }
    </style>
</head>
<body>

    <!-- ==========================================
    HEADER COM BOTÃO HOME
    ========================================== -->
    <header class="collaborators-header" id="collaboratorsHeader">
        <div class="header-left">
            <div class="brand-logo" id="brandLogo">
                <i class="fas fa-scissors brand-icon" id="logoIcon"></i>
                <img id="logoImage" style="display:none; height:32px; width:32px; border-radius:50%; object-fit:cover;" alt="Logo">
                <span class="brand-name">Colaboradores <small id="systemName">Studio DeVitto</small></span>
            </div>
        </div>
        <div class="header-actions">
            <span class="last-update" id="lastUpdateBadge">
                <i class="fas fa-clock me-1"></i>Atualizado agora

            <button class="btn-refresh" onclick="recarregarColaboradores()">
                <i class="fas fa-sync-alt me-1"></i>
            </button>
            <button class="btn-home" onclick="goHome()">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
        </div>

    <!-- ==========================================
    CONTEÚDO PRINCIPAL
    ========================================== -->
    <div class="collaborators-content" id="collaboratorsContent">

        <!-- ==========================================
        BARRA DE AÇÕES
        ========================================== -->
        <div class="add-btn-container">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="form-control" id="searchColaborador" placeholder="Buscar por nome, especialidade ou telefone...">
            </div>
            <div class="filter-buttons">
                <button class="btn-filter active" data-filter="all">Todos</button>
                <button class="btn-filter" data-filter="active">Ativos</button>
                <button class="btn-filter" data-filter="inactive">Inativos</button>
            </div>
            <button class="btn btn-primary" onclick="abrirModalNovoColaborador()">
                <i class="fas fa-plus me-1"></i>Novo Colaborador
            </button>
        </div>

        <!-- ==========================================
        GRID DE COLABORADORES
        ========================================== -->
        <div class="row g-3" id="colaboradoresGrid">
            <div class="col-12 text-center text-muted py-5">
                <div class="loading-spinner mb-3"></div>
                <p>Carregando colaboradores...</p>

        <!-- ==========================================
        CONTADOR
        ========================================== -->
        <div class="mt-3 text-muted fs-small" id="colaboradoresCounter">
            <span id="totalColaboradores">0</span> colaborador(es)
        </div>
    </div>

    <!-- ==========================================
    MODAL DO COLABORADOR (CRIAR/EDITAR/VER) - TELA CHEIA
    ========================================== -->
    <div class="modal fade colaborador-modal" id="colaboradorModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="colaboradorModalTitle">
                        <i class="fas fa-user-circle me-2"></i>Perfil do Colaborador
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="colaboradorModalBody">
                    <!-- Conteúdo carregado dinamicamente -->
                    <div class="text-center py-5">
                        <div class="loading-spinner mb-3"></div>
                        <p>Carregando perfil...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-danger" id="btnExcluirColaborador" style="display:none;">
                        <i class="fas fa-trash me-1"></i>Excluir
                    </button>
                    <button type="button" class="btn btn-primary" id="btnSalvarColaborador">
                        <i class="fas fa-save me-1"></i>Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
    MODAL DE VISUALIZAÇÃO DE FOTO (PORTFÓLIO)
    ========================================== -->
    <div class="modal fade" id="photoModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background:var(--primary-color);color:white;">
                    <h5 class="modal-title"><i class="fas fa-image me-2"></i>Foto do Portfólio</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="photoModalImg" src="" alt="Foto" style="max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain;">
                    <div class="mt-2">
                        <p class="text-muted" id="photoModalCaption">Sem legenda</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
    SCRIPTS
    ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ==========================================
        // 1. CONFIGURAÇÃO DO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC5ezGCOS5d-Vy2l-Gimkl_V9VmwDLZzKc",
            authDomain: "studio-devitto-152400.firebaseapp.com",
            projectId: "studio-devitto-152400",
            storageBucket: "studio-devitto-152400.appspot.com",
            messagingSenderId: "138996544906",
            appId: "1:138996544906:web:6569bf954a00e2f7944473",
            measurementId: "G-FCC5T13QW8"
        };

        const cloudinaryConfig = {
            cloudName: "daurmyabq",
            uploadPreset: "STUDIODEVITTO_PRESET"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // ==========================================
        // 2. VARIÁVEIS GLOBAIS
        // ==========================================
        let currentUser = null;
        let colaboradoresList = [];
        let colaboradorAtual = null;
        let portfolioFotos = [];
        let isEditando = false;
        let configAtual = {};
        let colaboradoresListener = null;
        let configListener = null;
        let currentFilter = 'all';
        let searchTerm = '';
        
        // Variáveis para período
        let periodoInicio = null;
        let periodoFim = null;
        
        // Cache de serviços para estatísticas
        let allServices = [];
        let allProductSales = [];

        // ==========================================
        // 3. INICIALIZAÇÃO
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            const hoje = new Date();
            const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
            periodoInicio = inicioMes;
            periodoFim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0, 23, 59, 59, 999);

            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    console.log('✅ Usuário autenticado:', user.email);
                    carregarConfiguracoes();
                    carregarTodosOsDados();
                } else {
                    mostrarLoginPrompt();
                }
            });
        });

        // ==========================================
        // 4. CARREGAR TODOS OS DADOS DO SISTEMA
        // ==========================================
        async function carregarTodosOsDados() {
            try {
                await carregarServicos();
                await carregarVendasProdutos();
                await carregarColaboradores();
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
            }
        }

        function carregarServicos() {
            return new Promise((resolve) => {
                if (!currentUser) { resolve(); return; }
                
                db.collection('services')
                    .where('userId', '==', currentUser.uid)
                    .get()
                    .then(snapshot => {
                        allServices = [];
                        snapshot.forEach(doc => {
                            allServices.push({ id: doc.id, ...doc.data() });
                        });
                        console.log('✅ Serviços carregados:', allServices.length);
                        resolve();
                    })
                    .catch(error => {
                        console.error('Erro ao carregar serviços:', error);
                        resolve();
                    });
            });
        }

        function carregarVendasProdutos() {
            return new Promise((resolve) => {
                if (!currentUser) { resolve(); return; }
                
                db.collection('productSales')
                    .where('userId', '==', currentUser.uid)
                    .get()
                    .then(snapshot => {
                        allProductSales = [];
                        snapshot.forEach(doc => {
                            allProductSales.push({ id: doc.id, ...doc.data() });
                        });
                        console.log('✅ Vendas de produtos carregadas:', allProductSales.length);
                        resolve();
                    })
                    .catch(error => {
                        console.error('Erro ao carregar vendas de produtos:', error);
                        resolve();
                    });
            });
        }

        // ==========================================
        // 5. RECEBER CONFIGURAÇÕES DA PÁGINA PRINCIPAL
        // ==========================================
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'configUpdated') {
                configAtual = event.data.config || {};
                console.log('📡 Configurações recebidas:', configAtual);
                aplicarConfiguracoes();
            }
        });

        function solicitarConfiguracoes() {
            try {
                window.parent.postMessage({ type: 'getConfig' }, '*');
            } catch(e) {
                carregarConfiguracoesLocal();
            }
        }

        // ==========================================
        // 6. CARREGAR CONFIGURAÇÕES
        // ==========================================
        function carregarConfiguracoes() {
            carregarConfiguracoesLocal();
            try {
                if (window.parent && window.parent !== window) {
                    solicitarConfiguracoes();
                }
            } catch(e) {}

            window.addEventListener('storage', function(e) {
                if (e.key === 'systemConfig') {
                    const config = JSON.parse(e.newValue);
                    if (config) {
                        configAtual = config;
                        aplicarConfiguracoes();
                    }
                }
            });
        }

        function carregarConfiguracoesLocal() {
            try {
                const saved = localStorage.getItem('systemConfig');
                if (saved) {
                    configAtual = JSON.parse(saved);
                    console.log('📦 Configurações carregadas do localStorage:', configAtual);
                    aplicarConfiguracoes();
                }
            } catch(e) {
                console.warn('Erro ao carregar configurações do localStorage:', e);
            }
        }

        // ==========================================
        // 7. APLICAR CONFIGURAÇÕES
        // ==========================================
        function aplicarConfiguracoes() {
            const root = document.documentElement;

            if (configAtual.corPrimaria) {
                root.style.setProperty('--primary-color', configAtual.corPrimaria);
                root.style.setProperty('--accent-color', configAtual.corPrimaria + '99');
            }

            if (configAtual.fontSize) {
                root.style.setProperty('--font-size-base', configAtual.fontSize);
            }

            if (configAtual.btnRadius) {
                root.style.setProperty('--btn-border-radius', configAtual.btnRadius);
            }

            if (configAtual.fontFamily) {
                root.style.setProperty('--font-family', configAtual.fontFamily);
            }

            const systemNameEl = document.getElementById('systemName');
            if (systemNameEl && configAtual.nome) {
                systemNameEl.textContent = configAtual.nome;
            }

            atualizarLogo();

            document.querySelectorAll('.collaborators-header, .colaborador-modal .modal-header').forEach(el => {
                el.style.background = 'linear-gradient(135deg, ' + (configAtual.corPrimaria || '#26196b') + ', ' + (
                    configAtual.corPrimaria || '#26196b') + '99)';
            });

            document.querySelectorAll('.btn-filter.active').forEach(el => {
                el.style.background = configAtual.corPrimaria || '#26196b';
                el.style.borderColor = configAtual.corPrimaria || '#26196b';
            });

            console.log('🎨 Configurações aplicadas nos Colaboradores');
        }

        // ==========================================
        // 8. LOGO
        // ==========================================
        function atualizarLogo() {
            const logoIcon = document.getElementById('logoIcon');
            const logoImage = document.getElementById('logoImage');

            if (configAtual.logo) {
                logoIcon.style.display = 'none';
                logoImage.style.display = 'inline-block';
                logoImage.src = configAtual.logo;
            } else {
                logoIcon.style.display = 'inline-block';
                logoImage.style.display = 'none';
            }
        }

        // ==========================================
        // 9. CARREGAR COLABORADORES
        // ==========================================
        function carregarColaboradores() {
            if (!currentUser) return;

            if (colaboradoresListener) {
                colaboradoresListener();
                colaboradoresListener = null;
            }

            const grid = document.getElementById('colaboradoresGrid');
            grid.innerHTML = `
                <div class="col-12 text-center text-muted py-5">
                    <div class="loading-spinner mb-3"></div>
                    <p>Carregando colaboradores...</p>
                </div>
            `;

            colaboradoresListener = db.collection('collaborators')
                .where('userId', '==', currentUser.uid)
                .onSnapshot(snapshot => {
                    colaboradoresList = [];
                    snapshot.forEach(doc => {
                        colaboradoresList.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    colaboradoresList.sort((a, b) => {
                        const ativoA = a.active !== false ? 0 : 1;
                        const ativoB = b.active !== false ? 0 : 1;
                        if (ativoA !== ativoB) return ativoA - ativoB;
                        return (a.name || '').localeCompare(b.name || '', 'pt-PT', { sensitivity: 'base' });
                    });
                    renderizarColaboradores();
                    atualizarUltimaAtualizacao();
                }, error => {
                    console.error('❌ Erro ao carregar colaboradores:', error);
                    grid.innerHTML = `
                        <div class="col-12 text-center text-danger py-5">
                            <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                            <p>Erro ao carregar colaboradores: ${error.message}</p>
                            <button class="btn btn-sm btn-primary mt-2" onclick="carregarColaboradores()">
                                <i class="fas fa-sync-alt me-1"></i>Tentar novamente
                            </button>
                        </div>
                    `;
                });
        }

        // ==========================================
        // 10. RENDERIZAR COLABORADORES
        // ==========================================
        function renderizarColaboradores() {
            const grid = document.getElementById('colaboradoresGrid');
            let filtered = [...colaboradoresList];

            if (searchTerm) {
                const search = searchTerm.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                filtered = filtered.filter(c => {
                    const nome = (c.name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    const especialidade = (c.specialty || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,
                    '');
                    const telefone = (c.contact || '').replace(/\D/g, '');
                    return nome.includes(search) || especialidade.includes(search) || telefone.includes(search);
                });
            }

            if (currentFilter === 'active') {
                filtered = filtered.filter(c => c.active !== false);
            } else if (currentFilter === 'inactive') {
                filtered = filtered.filter(c => c.active === false);
            }

            document.getElementById('totalColaboradores').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-12 text-center text-muted py-5">
                        <i class="fas fa-user-friends fa-3x mb-3 opacity-25"></i>
                        <p>${searchTerm ? 'Nenhum colaborador encontrado.' : 'Nenhum colaborador cadastrado.'}</p>
                        ${!searchTerm ? '<small>Clique em "Novo Colaborador" para adicionar.</small>' : ''}
                    </div>
                `;
                return;
            }

            const cores = ['#f7971e', '#bdc3c7', '#cd7f32', '#667eea', '#764ba2', '#28a745', '#17a2b8', '#dc3545', '#fd7e14',
                '#e83e8c'
            ];

            let html = '';
            filtered.forEach((colab, index) => {
                const cor = cores[index % cores.length];
                const isActive = colab.active !== false;
                const fotoHtml = colab.photoUrl ?
                    `<img src="${colab.photoUrl}" class="avatar" onerror="this.style.display='none'">` :
                    `<div class="avatar-placeholder">${(colab.name || '?').charAt(0).toUpperCase()}</div>`;

                const portfolioCount = (colab.portfolio || []).length;

                html += `
                    <div class="col-lg-4 col-md-6 col-12 mb-3">
                        <div class="colaborador-card" onclick="abrirPerfilColaborador('${colab.id}')">
                            <div class="card-header-custom" style="background:linear-gradient(135deg, ${cor}, ${cor}dd);">
                                ${fotoHtml}
                                <span class="status-badge ${isActive ? 'active' : 'inactive'}">
                                    ${isActive ? 'Ativo' : 'Inativo'}
                                </span>
                                ${portfolioCount > 0 ? `<span class="portfolio-badge"><i class="fas fa-images"></i> ${portfolioCount}</span>` : ''}
                                <h6>${colab.name || 'Sem nome'}</h6>
                                <small>${colab.specialty || 'Especialidade não definida'}</small>
                            </div>
                            <div class="card-body-custom">
                                <div class="stat-row">
                                    <span class="label"><i class="fas fa-phone me-1"></i>Contato</span>
                                    <span class="value">${colab.contact || 'Não informado'}</span>
                                </div>
                                <div class="stat-row">
                                    <span class="label"><i class="fas fa-percent me-1"></i>Comissão</span>
                                    <span class="value comissao">${colab.manualPercent || 0}%</span>
                                </div>
                                <div class="stat-row">
                                    <span class="label"><i class="fas fa-euro-sign me-1"></i>Salário Base</span>
                                    <span class="value">${colab.baseSalary ? '€ ' + parseFloat(colab.baseSalary).toFixed(2) : '€ 0,00'}</span>
                                </div>
                                <div class="stat-row" style="border-bottom:none;">
                                    <span class="label"><i class="fas fa-images me-1"></i>Portfólio</span>
                                    <span class="value">${portfolioCount} foto(s)</span>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); abrirPerfilColaborador('${colab.id}')">
                                    <i class="fas fa-eye me-1"></i>Ver
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); editarColaborador('${colab.id}')">
                                    <i class="fas fa-edit me-1"></i>Editar
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); excluirColaborador('${colab.id}')">
                                    <i class="fas fa-trash me-1"></i>
                                </button>

        async function abrirPerfilColaborador(colaboradorId, modoEdicao = false) {
            const colab = colaboradoresList.find(c => c.id === colaboradorId);
            if (!colab) {
                showToast('Colaborador não encontrado.', 'error');
                return;
            }

            // Recarregar serviços para garantir dados atualizados
            await carregarServicos();
            await carregarVendasProdutos();

            colaboradorAtual = colab;
            isEditando = modoEdicao;
            portfolioFotos = colab.portfolio || [];

            const modalBody = document.getElementById('colaboradorModalBody');

            // Calcular estatísticas com dados reais
            const stats = calcularEstatisticasColaboradorReais(colaboradorId);

        // ==========================================
        // 12. CALCULAR ESTATÍSTICAS REAIS DO COLABORADOR
        // ==========================================
        function calcularEstatisticasColaboradorReais(colaboradorId) {
            const agora = new Date();
            const inicio = periodoInicio ? new Date(periodoInicio) : new Date(agora.getFullYear(), agora.getMonth(), 1, 0, 0, 0, 0);
            const fim = periodoFim ? new Date(periodoFim) : new Date(agora);
            fim.setHours(23, 59, 59, 999);

            const colab = colaboradoresList.find(c => c.id === colaboradorId) || {};
            const percManual = parseFloat(colab.manualPercent || 0) || 0;
            const percProduct = parseFloat(colab.productPercent || 0) || 0;

            function dataRegistro(registro) {
                if (!registro || registro.date == null) return null;
                if (registro.date && typeof registro.date.toDate === 'function') return registro.date.toDate();
                if (typeof registro.date === 'string') {
                    const m = registro.date.match(/^(\d{4})-(\d{2})-(\d{2})/);
                    if (m) return new Date(+m[1], +m[2]-1, +m[3], 12, 0, 0, 0);
                }
                const d = new Date(registro.date);
                return isNaN(d.getTime()) ? null : d;
            }

            function numero(obj, campos) {
                for (const campo of campos) {
                    if (obj && obj[campo] !== undefined && obj[campo] !== null && obj[campo] !== '') {
                        const n = parseFloat(obj[campo]);
                        if (!isNaN(n)) return n;
                    }
                }
                return 0;
            }

            function pertenceAoPeriodo(data) {
                return data && data >= inicio && data <= fim;
            }

            const servicosPeriodo = allServices.filter(s => {
                return s.collaboratorId === colaboradorId && pertenceAoPeriodo(dataRegistro(s));
            });

            const vendasPeriodo = allProductSales.filter(s => {
                const id = s.collaboratorId ?? s.colaboradorId;
                return id === colaboradorId && pertenceAoPeriodo(dataRegistro(s));
            });

            let totalServicos = servicosPeriodo.length + vendasPeriodo.length;
            let totalBruto = 0;
            let totalComissao = 0;
            let totalSalao = 0;
            let comissoesPagas = 0;

            function registrarComissaoPaga(registro, comissao) {
                const paga = registro.comissaoPaga === true || registro.commissionPaid === true || registro.paidCommission === true || registro.comissaoJaPaga === true || registro.commissionPaidStatus === 'paid';
                const valorPago = numero(registro, ['comissaoPagaValor','commissionPaidAmount','paidCommissionAmount','valorComissaoPaga']);
                if (valorPago > 0) comissoesPagas += valorPago;
                else if (paga) comissoesPagas += comissao;
            }

            servicosPeriodo.forEach(service => {
                const valor = numero(service, ['value','valor','price','totalValue','total']);
                const tipo = String(service.type || service.tipo || 'manual').toLowerCase();
                const percentual = (tipo === 'product' || tipo === 'produto') ? percProduct : percManual;
                const comissao = valor * percentual / 100;
                totalBruto += valor;
                totalComissao += comissao;
                totalSalao += valor - comissao;
                registrarComissaoPaga(service, comissao);
            });

            vendasPeriodo.forEach(venda => {
                const valor = numero(venda, ['totalValue','total','value','valor','price']);
                let comissao = numero(venda, ['commissionAmount','comissaoValor','comissao']);
                if (comissao === 0) {
                    const percentual = numero(venda, ['commissionPercent','comissaoPercent','percentualComissao']) || percProduct;
                    comissao = valor * percentual / 100;
                }
                totalBruto += valor;
                totalComissao += comissao;
                totalSalao += valor - comissao;
                registrarComissaoPaga(venda, comissao);
            });

            // Hoje, Semana e Mês são calculados dentro do período selecionado.
            const inicioHoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate(), 0, 0, 0, 0);
            const fimHoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate(), 23, 59, 59, 999);
            const diaSemana = agora.getDay();
            const diasDesdeSegunda = diaSemana === 0 ? 6 : diaSemana - 1;
            const inicioSemana = new Date(agora);
            inicioSemana.setDate(agora.getDate() - diasDesdeSegunda);
            inicioSemana.setHours(0, 0, 0, 0);
            const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1, 0, 0, 0, 0);

            function somaJanela(inicioJanela, fimJanela) {
                const ini = new Date(Math.max(inicio.getTime(), inicioJanela.getTime()));
                const f = new Date(Math.min(fim.getTime(), fimJanela.getTime()));
                if (ini > f) return 0;
                let soma = 0;
                servicosPeriodo.forEach(r => {
                    const d = dataRegistro(r);
                    if (d >= ini && d <= f) soma += numero(r, ['value','valor','price','totalValue','total']);
                });
                vendasPeriodo.forEach(r => {
                    const d = dataRegistro(r);
                    if (d >= ini && d <= f) soma += numero(r, ['totalValue','total','value','valor','price']);
                });
                return soma;
            }

            const hojeBruto = somaJanela(inicioHoje, fimHoje);
            const semanaBruto = somaJanela(inicioSemana, fimHoje);
            const mesBruto = somaJanela(inicioMes, fimHoje);
            const totalGeral = totalBruto;
            const totalGeralLiquido = Math.max(0, totalGeral - comissoesPagas);

            return { totalServicos, totalBruto, totalComissao, totalSalao, hojeBruto, semanaBruto, mesBruto, totalGeral, comissoesPagas, totalGeralLiquido };
        }

        // ==========================================
        // 14. FUNÇÕES DE PERÍODO - APENAS ATUALIZA ESTATÍSTICAS
        // ==========================================
        function formatarDataLocalInput(data) {
            if (!data) return '';
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const dia = String(data.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function criarDataLocal(ano, mes, dia, hora = 0, minuto = 0, segundo = 0, ms = 0) {
            return new Date(ano, mes, dia, hora, minuto, segundo, ms);
        }

        function setPeriod(tipo, event) {
            if (event) event.preventDefault();

            const hoje = new Date();
            const anoAtual = hoje.getFullYear();
            const mesAtual = hoje.getMonth();
            let inicio, fim;

            switch (tipo) {
                case 'hoje':
                    inicio = criarDataLocal(anoAtual, mesAtual, hoje.getDate(), 0, 0, 0, 0);
                    fim = criarDataLocal(anoAtual, mesAtual, hoje.getDate(), 23, 59, 59, 999);
                    break;

                case 'semana': {
                    const diaSemana = hoje.getDay();
                    const diasDesdeSegunda = diaSemana === 0 ? 6 : diaSemana - 1;
                    const segundaAtual = criarDataLocal(anoAtual, mesAtual, hoje.getDate() - diasDesdeSegunda, 0, 0, 0, 0);
                    inicio = new Date(segundaAtual);
                    inicio.setDate(inicio.getDate() - 7);
                    fim = new Date(segundaAtual);
                    fim.setDate(fim.getDate() - 1);
                    fim.setHours(23, 59, 59, 999);
                    break;
                }

                case 'mes':
                    inicio = criarDataLocal(anoAtual, mesAtual, 1, 0, 0, 0, 0);
                    fim = criarDataLocal(anoAtual, mesAtual + 1, 0, 23, 59, 59, 999);
                    break;

                case 'ultimoMes':
                    inicio = criarDataLocal(anoAtual, mesAtual - 1, 1, 0, 0, 0, 0);
                    fim = criarDataLocal(anoAtual, mesAtual, 0, 23, 59, 59, 999);
                    break;

                case 'ano':
                    inicio = criarDataLocal(anoAtual, 0, 1, 0, 0, 0, 0);
                    fim = criarDataLocal(anoAtual, 11, 31, 23, 59, 59, 999);
                    break;

                default:
                    return false;
            }

            periodoInicio = inicio;
            periodoFim = fim;
            atualizarCamposPeriodo();

            document.querySelectorAll('.period-buttons button[data-periodo]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.periodo === tipo);
            });

            // ATUALIZA AUTOMATICAMENTE ao escolher Hoje/Semana/Mês/Último Mês/Ano.
            atualizarEstatisticasPeriodoAtual();
            return false;
        }

        function atualizarEstatisticasPeriodoAtual() {
            if (!colaboradorAtual || !colaboradorAtual.id) return;
            const stats = calcularEstatisticasColaboradorReais(colaboradorAtual.id);
            atualizarEstatisticasModal(stats);
        }

        function aplicarPeriodo(event) {
            if (event) event.preventDefault();
            const inicioInput = document.getElementById('periodoInicioInput');
            const fimInput = document.getElementById('periodoFimInput');
            if (!inicioInput || !fimInput) return false;

            const inicioVal = inicioInput.value;
            const fimVal = fimInput.value;
            if (!inicioVal || !fimVal) {
                showToast('Selecione a data inicial e a data final.', 'warning');
                return false;
            }

            const [ai, mi, di] = inicioVal.split('-').map(Number);
            const [af, mf, df] = fimVal.split('-').map(Number);
            const inicio = criarDataLocal(ai, mi - 1, di, 0, 0, 0, 0);
            const fim = criarDataLocal(af, mf - 1, df, 23, 59, 59, 999);

            if (inicio > fim) {
                showToast('Data inicial não pode ser maior que a final.', 'error');
                return false;
            }

            periodoInicio = inicio;
            periodoFim = fim;
            atualizarEstatisticasPeriodoAtual();
            return false;
        }

        function aoAlterarDataPeriodo() {
            const inicioInput = document.getElementById('periodoInicioInput');
            const fimInput = document.getElementById('periodoFimInput');
            if (!inicioInput || !fimInput || !inicioInput.value || !fimInput.value) return;

            const [ai, mi, di] = inicioInput.value.split('-').map(Number);
            const [af, mf, df] = fimInput.value.split('-').map(Number);
            const inicio = criarDataLocal(ai, mi - 1, di, 0, 0, 0, 0);
            const fim = criarDataLocal(af, mf - 1, df, 23, 59, 59, 999);

            if (inicio > fim) {
                fimInput.setCustomValidity('A data final deve ser igual ou posterior à data inicial.');
                return;
            }
            fimInput.setCustomValidity('');
            periodoInicio = inicio;
            periodoFim = fim;

            document.querySelectorAll('.period-buttons button[data-periodo]').forEach(btn => btn.classList.remove('active'));

            // DIGITOU/SELECIONOU X ATÉ Y: atualiza automaticamente.
            atualizarEstatisticasPeriodoAtual();
        }

        function limparPeriodo(event) {
            if (event) event.preventDefault();
            const hoje = new Date();
            periodoInicio = criarDataLocal(hoje.getFullYear(), hoje.getMonth(), 1, 0, 0, 0, 0);
            periodoFim = criarDataLocal(hoje.getFullYear(), hoje.getMonth() + 1, 0, 23, 59, 59, 999);
            atualizarCamposPeriodo();
            document.querySelectorAll('.period-buttons button[data-periodo]').forEach(btn => btn.classList.remove('active'));

        // ==========================================
        // 19. UPLOAD / REDIMENSIONAMENTO DA FOTO DE PERFIL - CORRIGIDO
        // ==========================================
        async function uploadFotoPerfil(file) {
            if (!file || !file.type || !file.type.startsWith('image/')) {
                showToast('Selecione um arquivo de imagem válido.', 'error');
                return;
            }

            try {
                // Carregar a imagem para obter dimensões
                const imagem = await carregarImagem(file);

                // Mostrar dialog para redimensionar
                const resultado = await Swal.fire({
                    title: 'Configurar foto de perfil',
                    html: `
                        <div class="text-start">
                            <div class="mb-2 small text-muted">Imagem original: ${imagem.naturalWidth || imagem.width} × ${imagem.naturalHeight || imagem.height}px</div>
                            <label class="form-label">Largura (px)</label>
                            <input id="fotoLargura" type="number" class="form-control" value="600" min="100" max="3000">
                            <label class="form-label mt-2">Altura (px)</label>
                            <input id="fotoAltura" type="number" class="form-control" value="600" min="100" max="3000">
                            <div class="form-check mt-2">
                                <input id="fotoQuadrada" class="form-check-input" type="checkbox" checked>
                                <label for="fotoQuadrada" class="form-check-label">Manter largura e altura iguais</label>
                            </div>
                        </div>`,
                    showCancelButton: true,
                    confirmButtonText: 'Redimensionar e enviar',
                    cancelButtonText: 'Cancelar',
                    focusConfirm: false,
                    didOpen: () => {
                        const w = document.getElementById('fotoLargura');
                        const h = document.getElementById('fotoAltura');
                        const q = document.getElementById('fotoQuadrada');
                        w.addEventListener('input', () => { if (q.checked) h.value = w.value; });
                        h.addEventListener('input', () => { if (q.checked) w.value = h.value; });
                    },
                    preConfirm: () => {
                        const w = parseInt(document.getElementById('fotoLargura')?.value, 10);
                        const h = parseInt(document.getElementById('fotoAltura')?.value, 10);
                        if (!Number.isFinite(w) || !Number.isFinite(h) || w < 100 || h < 100 || w > 3000 || h > 3000) {
                            Swal.showValidationMessage('Informe largura e altura entre 100 e 3000 pixels.');
                            return false;
                        }
                        return { largura: w, altura: h };
                    }
                });

                if (!resultado.isConfirmed) return;

                showToast('Redimensionando e enviando foto...', 'info');

                // Redimensionar a imagem
                const blob = await redimensionarImagem(imagem, resultado.value.largura, resultado.value.altura, 'image/jpeg', 0.90);

                // Upload para o Cloudinary
                const secureUrl = await enviarParaCloudinary(blob, 'perfil.jpg');

                // Atualizar o colaborador atual
                if (!colaboradorAtual) colaboradorAtual = {};
                colaboradorAtual.photoUrl = secureUrl;

                // Atualizar a UI
                atualizarFotoPerfilUI(secureUrl);

                // Se o colaborador já existe no Firestore, salvar imediatamente
                if (colaboradorAtual.id && currentUser) {
                    await db.collection('collaborators').doc(colaboradorAtual.id).set({
                        photoUrl: secureUrl,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    // Atualizar a lista local
                    atualizarColaboradorLocal(colaboradorAtual.id, { photoUrl: secureUrl });
                }

                showToast('Foto de perfil salva com sucesso!', 'success');

            } catch (error) {
                console.error('❌ Erro ao enviar foto de perfil:', error);
                showToast('Não foi possível salvar a foto: ' + obterMensagemErro(error), 'error');
            } finally {
                const input = document.getElementById('fotoUpload');
                if (input) input.value = '';
            }
        }

        function carregarImagem(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('O navegador não conseguiu ler a imagem selecionada.'));
                };
                img.src = url;
            });
        }

        function redimensionarImagem(img, largura, altura, tipo = 'image/jpeg', qualidade = 0.90) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                canvas.width = largura;
                canvas.height = altura;
                const ctx = canvas.getContext('2d');
                if (!ctx) {
                    reject(new Error('Canvas não disponível no navegador.'));
                    return;
                }
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, largura, altura);
                ctx.drawImage(img, 0, 0, largura, altura);
                canvas.toBlob(blob => {
                    if (!blob) reject(new Error('Não foi possível criar a imagem redimensionada.'));
                    else resolve(blob);
                }, tipo, qualidade);
            });
        }

        async function enviarParaCloudinary(fileOrBlob, nomeArquivo = 'imagem.jpg') {
            if (!cloudinaryConfig.cloudName || !cloudinaryConfig.uploadPreset) {
                throw new Error('Configuração do Cloudinary não encontrada.');
            }

            const formData = new FormData();
            formData.append('file', fileOrBlob, nomeArquivo);
            formData.append('upload_preset', cloudinaryConfig.uploadPreset);

            const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`, {
                method: 'POST',
                body: formData
            });

            let data = {};
            try { data = await response.json(); } catch (_) {}

            if (!response.ok || !data.secure_url) {
                throw new Error(data?.error?.message || `Cloudinary recusou o upload (HTTP ${response.status}).`);
            }
            return data.secure_url;
        }

        // ==========================================
        async function uploadFotosPortfolio(files) {
            const arquivos = Array.from(files || []).filter(file => file && file.type?.startsWith('image/'));
            if (!arquivos.length) {
                showToast('Selecione pelo menos uma imagem válida.', 'warning');
                return;
            }

            const disponiveis = 10 - portfolioFotos.length;
            if (arquivos.length > disponiveis) {
                showToast(`Você pode adicionar apenas mais ${Math.max(0, disponiveis)} foto(s). Limite: 10.`, 'warning');
                return;
            }

            try {
                showToast(`Enviando ${arquivos.length} foto(s)...`, 'info');

                const novasFotos = [];
                for (const file of arquivos) {
                    const url = await enviarParaCloudinary(file, file.name || 'portfolio.jpg');
                    novasFotos.push({
                        url: url,
                        legenda: '',
                        data: new Date().toISOString()
                    });
                }

                // Atualizar o portfólio local
                portfolioFotos = [...portfolioFotos, ...novasFotos];
                atualizarPortfolioUI();

                // Se o colaborador já existe no Firestore, salvar imediatamente
                if (colaboradorAtual?.id && currentUser) {
                    await db.collection('collaborators').doc(colaboradorAtual.id).set({
                        portfolio: portfolioFotos,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    colaboradorAtual.portfolio = [...portfolioFotos];
                    atualizarColaboradorLocal(colaboradorAtual.id, { portfolio: [...portfolioFotos] });
                    showToast(`${novasFotos.length} foto(s) adicionada(s) e salva(s) no portfólio!`, 'success');
                } else {
                    showToast(`${novasFotos.length} foto(s) adicionada(s). Clique em Salvar para gravar o colaborador.`, 'success');
                }

            } catch (error) {
                console.error('❌ Erro no upload do portfólio:', error);
                showToast('Não foi possível salvar o portfólio: ' + obterMensagemErro(error), 'error');
            } finally {
                const input = document.getElementById('portfolioUpload');
                if (input) input.value = '';
            }
        }
