    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <style>
        /* ============================================
           BLOQUEIO DE ZOOM
           ============================================ */
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            -ms-touch-action: manipulation !important;
            touch-action: manipulation !important;
        }
        
        html, body {
            touch-action: pan-x pan-y !important;
            -ms-touch-action: pan-x pan-y !important;
            -webkit-text-size-adjust: 100% !important;
            -moz-text-size-adjust: 100% !important;
            -ms-text-size-adjust: 100% !important;
            text-size-adjust: 100% !important;
        }
        
        input, select, textarea, button, .btn, .nav-link, .mobile-card, .sidebar .nav-link,
        .form-control, .form-select, .modal, .modal-content, .dropdown-menu {
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }
        
        input[type="text"], input[type="email"], input[type="password"], input[type="number"],
        input[type="date"], input[type="time"], textarea, select {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        /* ============================================
           VARIÁVEIS DINÂMICAS
           ============================================ */
        :root {
            --primary-color: #26196b;
            --secondary-color: #ffd700;
            --accent-color: #4a3a9c;
            --light-bg: #f8f9fa;
            --card-radius: 12px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --btn-border-radius: 8px;
            --btn-padding: 8px 20px;
            --font-size-base: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--light-bg);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-size: var(--font-size-base);
            overflow-x: hidden !important;
            max-width: 100vw !important;
        }

        /* ============================================
           CABEÇALHO COM BOTÃO HOME
           ============================================ */
        .reports-header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .reports-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reports-header .header-left .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reports-header .header-left .brand-logo img {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .reports-header .header-left .brand-logo .brand-icon {
            font-size: 1.5rem;
            color: var(--secondary-color);
        }

        .reports-header .header-left .brand-logo .brand-name {
            font-weight: 700;
            font-size: 1rem;
            color: white;
        }

        .reports-header .header-left .brand-logo .brand-name small {
            font-weight: 400;
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 6px;
        }

        .reports-header .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-home {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 25px;
            padding: 6px 14px;
            font-size: 0.8rem;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-home:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .btn-home i {
            font-size: 0.9rem;
        }

        .btn-refresh {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 25px;
            padding: 6px 12px;
            font-size: 0.8rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-refresh:hover {
            background: rgba(255,255,255,0.25);
        }

        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .last-update {
            font-size: 0.65rem;
            opacity: 0.7;
            color: rgba(255,255,255,0.8);
        }

        /* ============================================
           CONTEÚDO PRINCIPAL
           ============================================ */
        .reports-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 16px;
        }

        /* ============================================
           FILTROS DE RELATÓRIOS
           ============================================ */
        .filters-container {
            background: white;
            border-radius: var(--card-radius);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .filters-container .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .filters-container .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filters-container .filter-group label {
            font-weight: 600;
            font-size: 0.75rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
            display: block;
        }

        .filters-container .filter-group .form-control,
        .filters-container .filter-group .form-select {
            border-radius: var(--btn-border-radius);
            border: 2px solid #e9ecef;
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        .filters-container .filter-group .form-control:focus,
        .filters-container .filter-group .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(38,25,107,0.15);
        }

        .filters-container .filter-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filters-container .filter-actions .btn {
            padding: 6px 16px;
            border-radius: var(--btn-border-radius);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-generate-report {
            background: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-generate-report:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(38,25,107,0.3);
        }

        .btn-export-pdf {
            background: #dc3545;
            color: white;
            border: none;
        }

        .btn-export-pdf:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220,53,69,0.3);
        }

        /* ============================================
           ESTATÍSTICAS RÁPIDAS
           ============================================ */
        .stats-quick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stats-quick-item {
            background: white;
            border-radius: var(--card-radius);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s;
        }

        .stats-quick-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stats-quick-item .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stats-quick-item .stat-label {
            font-size: 0.7rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stats-quick-item .stat-number.positive {
            color: #28a745;
        }
        .stats-quick-item .stat-number.danger {
            color: #dc3545;
        }
        .stats-quick-item .stat-number.warning {
            color: #ffc107;
        }
        .stats-quick-item .stat-number.info {
            color: #17a2b8;
        }

        /* ============================================
           TABELA DE RELATÓRIOS
           ============================================ */
        .table-container {
            background: white;
            border-radius: var(--card-radius);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            overflow-x: auto;
        }

        .table-container .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .table-container .table-header h5 {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1rem;
            margin: 0;
        }

        .table-container .table-header .table-info {
            font-size: 0.75rem;
            color: #6c757d;
        }

        .table-container table {
            width: 100%;
            font-size: 0.85rem;
            border-collapse: collapse;
        }

        .table-container table th {
            background: var(--primary-color);
            color: white;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        .table-container table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .table-container table tr:hover td {
            background: #f8f9fa;
        }

        .table-container table .text-success {
            color: #28a745;
            font-weight: 600;
        }

        .table-container table .text-danger {
            color: #dc3545;
            font-weight: 600;
        }

        .table-container .no-data {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .table-container .no-data i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 12px;
        }

        /* ============================================
           GRÁFICOS
           ============================================ */
        .chart-container {
            background: white;
            border-radius: var(--card-radius);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            height: 280px;
            position: relative;
        }

        .chart-container h6 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ============================================
           RESPONSIVIDADE
           ============================================ */
        @media (max-width: 768px) {
            .reports-header {
                padding: 10px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }

            .reports-header .header-left {
                gap: 8px;
                flex-wrap: wrap;
            }

            .reports-header .header-left .brand-logo .brand-name {
                font-size: 0.85rem;
            }

            .reports-header .header-left .brand-logo img {
                height: 28px;
                width: 28px;
            }

            .reports-header .header-actions {
                justify-content: flex-start;
            }

            .reports-content {
                padding: 8px 10px;
            }

            .filters-container {
                padding: 12px 14px;
            }

            .filters-container .filter-row {
                flex-direction: column;
                gap: 8px;
            }

            .filters-container .filter-group {
                min-width: 100%;
            }

            .stats-quick-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .stats-quick-item .stat-number {
                font-size: 1.2rem;
            }

            .chart-container {
                height: 200px;
                padding: 12px 14px;
            }

            .table-container {
                padding: 12px 14px;
            }

            .table-container table {
                font-size: 0.75rem;
            }

            .table-container table th,
            .table-container table td {
                padding: 6px 8px;
            }

            .btn-home {
                padding: 5px 12px;
                font-size: 0.7rem;
            }

            .btn-refresh {
                padding: 5px 10px;
                font-size: 0.7rem;
            }

            .last-update {
                font-size: 0.55rem;
            }

            .filters-container .filter-actions .btn {
                padding: 4px 12px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .reports-header {
                padding: 8px 10px;
            }

            .reports-header .header-left .brand-logo .brand-name {
                font-size: 0.75rem;
            }

            .reports-header .header-left .brand-logo .brand-name small {
                display: none;
            }

            .reports-header .header-left .brand-logo img {
                height: 24px;
                width: 24px;
            }

            .reports-content {
                padding: 6px 4px;
            }

            .stats-quick-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .stats-quick-item {
                padding: 10px 8px;
            }

            .stats-quick-item .stat-number {
                font-size: 1rem;
            }

            .stats-quick-item .stat-label {
                font-size: 0.6rem;
            }

            .chart-container {
                height: 160px;
                padding: 8px 10px;
            }

            .table-container {
                padding: 8px 10px;
            }

            .table-container table {
                font-size: 0.65rem;
            }

            .table-container table th,
            .table-container table td {
                padding: 4px 6px;
            }

            .filters-container {
                padding: 8px 10px;
            }

            .filters-container .filter-group label {
                font-size: 0.65rem;
            }

            .filters-container .filter-group .form-control,
            .filters-container .filter-group .form-select {
                font-size: 0.75rem;
                padding: 4px 8px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .stats-quick-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .filters-container .filter-row {
                flex-wrap: wrap;
            }

            .filters-container .filter-group {
                min-width: 180px;
                flex: 1 1 auto;
            }
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* ============================================
           UTILITÁRIOS
           ============================================ */
        .text-primary-custom { color: var(--primary-color); }
        .bg-primary-custom { background: var(--primary-color); }
        .border-primary-custom { border-color: var(--primary-color); }
        .cursor-pointer { cursor: pointer; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .flex-wrap { flex-wrap: wrap; }
        .align-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 16px; }
        .mt-4 { margin-top: 24px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 16px; }
        .mb-4 { margin-bottom: 24px; }
        .text-muted { color: #6c757d; }
        .text-success { color: #28a745; }
        .text-danger { color: #dc3545; }
        .text-warning { color: #ffc107; }
        .text-primary { color: var(--primary-color); }
        .fw-bold { font-weight: 700; }
        .fw-semibold { font-weight: 600; }
        .fs-small { font-size: 0.75rem; }
        .fs-large { font-size: 1.05rem; }

        /* ============================================
           ANIMAÇÃO DE LOADING
           ============================================ */
        .loading-spinner {
            display: inline-block;
            width: 26px;
            height: 26px;
            border: 3px solid rgba(38,25,107,0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           TOAST / NOTIFICAÇÃO
           ============================================ */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            z-index: 9999;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }

        .toast-notification.success {
            background: #28a745;
        }

        .toast-notification.error {
            background: #dc3545;
        }

        .toast-notification.info {
            background: #17a2b8;
        }

        .toast-notification.warning {
            background: #ffc107;
            color: #000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================
           BADGE DE STATUS
           ============================================ */
        .badge-status {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .badge-status.paid {
            background: #d4edda;
            color: #155724;
        }

        .badge-status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .badge-status.overdue {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .badge-status.cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-status.scheduled {
            background: #cce5ff;
            color: #004085;
        }

        .badge-status.confirmed {
            background: #d4edda;
            color: #155724;
        }

        /* ============================================
           PWA INSTALL BANNER
           ============================================ */
        .pwa-install-banner {
            display: none;
            background: var(--primary-color);
            color: white;
            padding: 10px 16px;
            border-radius: var(--card-radius);
            margin-bottom: 16px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pwa-install-banner.show {
            display: flex;
        }

        .pwa-install-banner .pwa-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .pwa-install-banner .pwa-text i {
            font-size: 1.5rem;
            color: var(--secondary-color);
        }

        .pwa-install-banner .btn-install {
            background: var(--secondary-color);
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pwa-install-banner .btn-install:hover {
            transform: scale(1.05);
        }

        .pwa-install-banner .btn-close-banner {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .pwa-install-banner .btn-close-banner:hover {
            color: white;
        }
    </style>
</head>
<body>

    <!-- ==========================================
    HEADER COM BOTÃO HOME
    ========================================== -->
    <header class="reports-header" id="reportsHeader">
        <div class="header-left">
            <div class="brand-logo" id="brandLogo">
                <i class="fas fa-chart-bar brand-icon" id="logoIcon"></i>
                <img id="logoImage" style="display:none; height:32px; width:32px; border-radius:50%; object-fit:cover;" alt="Logo">
                <span class="brand-name">Relatórios <small id="systemName">Studio DeVitto</small></span>
            </div>

            });

            document.getElementById('btnInstallPWA').addEventListener('click', async function() {
                if (deferredPrompt) {

                    deferredPrompt = null;

                document.getElementById('pwaInstallBanner').classList.remove('show');
            });

            window.addEventListener('appinstalled', function() {

        // ==========================================
        // 5. RECEBER CONFIGURAÇÕES DA PÁGINA PRINCIPAL
        // ==========================================
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'configUpdated') {
                configAtual = event.data.config || {};
                console.log('📡 Configurações recebidas:', configAtual);
                aplicarConfiguracoes();
            }
        });

        function solicitarConfiguracoes() {
            try {
                window.parent.postMessage({ type: 'getConfig' }, '*');
            } catch(e) {
                carregarConfiguracoesLocal();
            }
        }

        // ==========================================
        // 6. CARREGAR CONFIGURAÇÕES
        // ==========================================
        function carregarConfiguracoes() {
            carregarConfiguracoesLocal();
            try {
                if (window.parent && window.parent !== window) {
                    solicitarConfiguracoes();
                }
            } catch(e) {}

            window.addEventListener('storage', function(e) {
                if (e.key === 'systemConfig') {
                    const config = JSON.parse(e.newValue);
                    if (config) {
                        configAtual = config;
                        aplicarConfiguracoes();
                    }
                }
            });
        }

        function carregarConfiguracoesLocal() {
            try {
                const saved = localStorage.getItem('systemConfig');
                if (saved) {
                    configAtual = JSON.parse(saved);
                    console.log('📦 Configurações carregadas do localStorage:', configAtual);
                    aplicarConfiguracoes();
                }
            } catch(e) {
                console.warn('Erro ao carregar configurações do localStorage:', e);
            }

            }

            if (configAtual.btnRadius) {
                root.style.setProperty('--btn-border-radius', configAtual.btnRadius);
            }

            if (configAtual.fontFamily) {
                root.style.setProperty('--font-family', configAtual.fontFamily);

            const systemNameEl = document.getElementById('systemName');
            if (systemNameEl && configAtual.nome) {
                systemNameEl.textContent = configAtual.nome;

            atualizarLogo();

            document.querySelectorAll('.reports-header, .pwa-install-banner').forEach(el => {
                if (el) {
                    el.style.background = 'linear-gradient(135deg, ' + (configAtual.corPrimaria || '#26196b') + ', ' + (
                        configAtual.corPrimaria || '#26196b') + '99)';

        // ==========================================

        function carregarFiltros() {

        // ==========================================
        // 10. GERAR RELATÓRIO
        // ==========================================
        function gerarRelatorio() {
            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;
            const tipo = document.getElementById('tipoRelatorio').value;
            const colaboradorId = document.getElementById('colaboradorFiltro').value;
            const clienteId = document.getElementById('clienteFiltro').value;

            if (!dataInicio || !dataFim) {
                showToast('Selecione as datas de início e fim.', 'warning');
                return;
            }

            const inicio = new Date(dataInicio);
            const fim = new Date(dataFim);
            fim.setHours(23, 59, 59, 999);

            // Filtrar dados por período
            let servicosFiltrados = filtrarPorPeriodo(allServices, inicio, fim);
            let vendasFiltradas = filtrarPorPeriodo(allProductSales, inicio, fim);
            let agendamentosFiltrados = filtrarPorPeriodo(appointments, inicio, fim);
            let despesasFiltradas = filtrarPorPeriodo(expenses, inicio, fim);
            let salariosFiltrados = filtrarPorPeriodo(salaryPayments, inicio, fim);

            // Aplicar filtros adicionais
            if (colaboradorId !== 'all') {
                servicosFiltrados = servicosFiltrados.filter(s => s.collaboratorId === colaboradorId);
                agendamentosFiltrados = agendamentosFiltrados.filter(a => a.collaboratorId === colaboradorId);
            }

            if (clienteId !== 'all') {
                servicosFiltrados = servicosFiltrados.filter(s => s.clientId === clienteId);
                vendasFiltradas = vendasFiltradas.filter(v => v.clientId === clienteId);
                agendamentosFiltrados = agendamentosFiltrados.filter(a => a.clientId === clienteId);
            }

            // Gerar dados conforme tipo
            switch (tipo) {
                case 'geral':
                    gerarRelatorioGeral(servicosFiltrados, vendasFiltradas, agendamentosFiltrados, despesasFiltradas, salariosFiltrados);
                    break;
                case 'servicos':
                    gerarRelatorioServicos(servicosFiltrados);
                    break;
                case 'produtos':
                    gerarRelatorioProdutos(vendasFiltradas);
                    break;
                case 'clientes':
                    gerarRelatorioClientes(servicosFiltrados, vendasFiltradas, agendamentosFiltrados);
                    break;
                case 'colaboradores':
                    gerarRelatorioColaboradores(servicosFiltrados, vendasFiltradas, agendamentosFiltrados);
                    break;
                case 'financeiro':
                    gerarRelatorioFinanceiro(servicosFiltrados, vendasFiltradas, despesasFiltradas, salariosFiltrados);
                    break;
                case 'agenda':
                    gerarRelatorioAgenda(agendamentosFiltrados);
                    break;
                default:
                    gerarRelatorioGeral(servicosFiltrados, vendasFiltradas, agendamentosFiltrados, despesasFiltradas, salariosFiltrados);
            }

            // Atualizar estatísticas rápidas
            atualizarStats(servicosFiltrados, vendasFiltradas, agendamentosFiltrados);
        }

        function filtrarPorPeriodo(dados, inicio, fim) {
            return dados.filter(item => {
                if (!item.date) return false;
                const data = new Date(item.date);
                return data >= inicio && data <= fim;
            });
        }

        function getValor(item, campos) {
            for (const campo of campos) {
                if (item && item[campo] !== undefined && item[campo] !== null && item[campo] !== '') {
                    const n = parseFloat(item[campo]);
                    if (!isNaN(n)) return n;
                }
            }
            return 0;
        }

        function getNomeCliente(id) {
            const cliente = clients.find(c => c.id === id);
            return cliente ? cliente.name : 'Cliente não encontrado';
        }

        function getNomeColaborador(id) {
            const colaborador = collaborators.find(c => c.id === id);
            return colaborador ? colaborador.name : 'Colaborador não encontrado';
        }

        function getNomeProduto(id) {
            const produto = products.find(p => p.id === id);
            return produto ? produto.name : 'Produto não encontrado';
        }

        // ==========================================
        // 11. ATUALIZAR ESTATÍSTICAS RÁPIDAS
        // ==========================================
        function atualizarStats(servicos, vendas, agendamentos) {
            const totalServicos = servicos.length;
            const totalVendas = vendas.reduce((sum, v) => sum + getValor(v, ['totalValue', 'total', 'value', 'valor']), 0);
            const totalProdutos = vendas.reduce((sum, v) => sum + getValor(v, ['quantity', 'quantidade']), 0);
            
            // Clientes ativos no período
            const clientesAtivos = new Set();
            servicos.forEach(s => { if (s.clientId) clientesAtivos.add(s.clientId); });
            vendas.forEach(v => { if (v.clientId) clientesAtivos.add(v.clientId); });
            agendamentos.forEach(a => { if (a.clientId) clientesAtivos.add(a.clientId); });

            document.getElementById('statTotalVendas').textContent = formatCurrency(totalVendas);
            document.getElementById('statTotalServicos').textContent = totalServicos;
            document.getElementById('statTotalProdutos').textContent = Math.round(totalProdutos);
            document.getElementById('statTotalClientes').textContent = clientesAtivos.size;
        }

        // ==========================================
        // 12. RELATÓRIO GERAL
        // ==========================================
        function gerarRelatorioGeral(servicos, vendas, agendamentos, despesas, salarios) {
            const totalServicos = servicos.reduce((sum, s) => sum + getValor(s, ['value', 'valor']), 0);
            const totalVendas = vendas.reduce((sum, v) => sum + getValor(v, ['totalValue', 'total', 'value', 'valor']), 0);
            const totalDespesas = despesas.filter(d => d.paid).reduce((sum, d) => sum + getValor(d, ['value', 'valor']), 0);
            const totalSalarios = salarios.reduce((sum, s) => sum + getValor(s, ['totalValue', 'baseValue', 'total']), 0);
            const totalAgendamentos = agendamentos.length;

            const dados = [
                { label: 'Serviços Realizados', valor: servicos.length, total: formatCurrency(totalServicos) },
                { label: 'Produtos Vendidos', valor: vendas.length, total: formatCurrency(totalVendas) },
                { label: 'Agendamentos', valor: totalAgendamentos, total: '-' },
                { label: 'Despesas Pagas', valor: despesas.filter(d => d.paid).length, total: formatCurrency(totalDespesas) },
                { label: 'Salários Pagos', valor: salarios.length, total: formatCurrency(totalSalarios) }
            ];

            const totalGeral = totalServicos + totalVendas;
            const totalGastos = totalDespesas + totalSalarios;
            const lucro = totalGeral - totalGastos;

            dados.push({ label: '📊 Total Geral', valor: '-', total: formatCurrency(totalGeral) });
            dados.push({ label: '💰 Total Gastos', valor: '-', total: formatCurrency(totalGastos) });
            dados.push({ label: '📈 Lucro Líquido', valor: '-', total: formatCurrency(lucro) });

            dadosRelatorio = dados;
            renderizarTabela('📊 Relatório Geral', dados, ['Item', 'Quantidade', 'Valor']);
            atualizarGrafico(dados);
            document.getElementById('tableInfo').textContent = `${servicos.length + vendas.length} registros encontrados`;
        }

        // ==========================================
        // 13. RELATÓRIO DE SERVIÇOS
        // ==========================================
        function gerarRelatorioServicos(servicos) {
            if (servicos.length === 0) {
                dadosRelatorio = [];
                renderizarTabela('📋 Relatório de Serviços', [], ['Data', 'Cliente', 'Colaborador', 'Descrição', 'Valor']);
                document.getElementById('tableInfo').textContent = 'Nenhum serviço encontrado';
                atualizarGrafico([]);
                return;
            }

            const dados = servicos.map(s => ({
                data: formatarData(s.date),
                cliente: getNomeCliente(s.clientId),
                colaborador: getNomeColaborador(s.collaboratorId),
                descricao: s.description || 'Serviço',
                valor: formatCurrency(getValor(s, ['value', 'valor']))
            }));

            dadosRelatorio = dados;
            renderizarTabela('📋 Relatório de Serviços', dados, ['Data', 'Cliente', 'Colaborador', 'Descrição', 'Valor']);
            document.getElementById('tableInfo').textContent = `${servicos.length} serviços encontrados`;
            
            // Gráfico de serviços por colaborador
            const colaboradoresMap = {};
            servicos.forEach(s => {
                const nome = getNomeColaborador(s.collaboratorId);
                colaboradoresMap[nome] = (colaboradoresMap[nome] || 0) + getValor(s, ['value', 'valor']);
            });
            const graficoData = Object.entries(colaboradoresMap).map(([label, valor]) => ({ label, valor }));
            atualizarGrafico(graficoData);
        }

        // ==========================================
        // 14. RELATÓRIO DE PRODUTOS
        // ==========================================
        function gerarRelatorioProdutos(vendas) {
            if (vendas.length === 0) {
                dadosRelatorio = [];
                renderizarTabela('📦 Relatório de Produtos', [], ['Produto', 'Quantidade', 'Valor Unitário', 'Total']);
                document.getElementById('tableInfo').textContent = 'Nenhuma venda de produto encontrada';
                atualizarGrafico([]);
                return;
            }

            const produtosMap = {};
            vendas.forEach(v => {
                const nome = getNomeProduto(v.productId);
                if (!produtosMap[nome]) {
                    produtosMap[nome] = { quantidade: 0, total: 0 };
                }
                produtosMap[nome].quantidade += getValor(v, ['quantity', 'quantidade']) || 1;
                produtosMap[nome].total += getValor(v, ['totalValue', 'total', 'value', 'valor']);
            });

            const dados = Object.entries(produtosMap).map(([nome, dados]) => ({
                produto: nome,
                quantidade: dados.quantidade,
                total: formatCurrency(dados.total)
            }));

            dadosRelatorio = dados;
            renderizarTabela('📦 Relatório de Produtos', dados, ['Produto', 'Quantidade', 'Total']);
            document.getElementById('tableInfo').textContent = `${vendas.length} vendas encontradas`;
            
            const graficoData = Object.entries(produtosMap).map(([label, dados]) => ({ label, valor: dados.total }));
            atualizarGrafico(graficoData);
        }

        // ==========================================
        // 15. RELATÓRIO DE CLIENTES
        // ==========================================
        function gerarRelatorioClientes(servicos, vendas, agendamentos) {
            const clientesMap = {};
            
            servicos.forEach(s => {
                const id = s.clientId;
                if (!clientesMap[id]) {
                    clientesMap[id] = { nome: getNomeCliente(id), servicos: 0, vendas: 0, total: 0, agendamentos: 0 };
                }
                clientesMap[id].servicos++;
                clientesMap[id].total += getValor(s, ['value', 'valor']);
            });

            vendas.forEach(v => {
                const id = v.clientId;
                if (!id) return;
                if (!clientesMap[id]) {
                    clientesMap[id] = { nome: getNomeCliente(id), servicos: 0, vendas: 0, total: 0, agendamentos: 0 };
                }
                clientesMap[id].vendas++;
                clientesMap[id].total += getValor(v, ['totalValue', 'total', 'value', 'valor']);
            });

            agendamentos.forEach(a => {
                const id = a.clientId;
                if (!id) return;
                if (!clientesMap[id]) {
                    clientesMap[id] = { nome: getNomeCliente(id), servicos: 0, vendas: 0, total: 0, agendamentos: 0 };
                }
                clientesMap[id].agendamentos++;
            });

            const dados = Object.values(clientesMap)
                .sort((a, b) => b.total - a.total)
                .map(c => ({
                    nome: c.nome,
                    servicos: c.servicos,
                    vendas: c.vendas,
                    agendamentos: c.agendamentos,
                    total: formatCurrency(c.total)
                }));

            dadosRelatorio = dados;
            renderizarTabela('👤 Relatório de Clientes', dados, ['Cliente', 'Serviços', 'Vendas', 'Agendamentos', 'Total Gasto']);
            document.getElementById('tableInfo').textContent = `${dados.length} clientes encontrados`;
            
            const graficoData = Object.values(clientesMap)
                .sort((a, b) => b.total - a.total)
                .slice(0, 10)
                .map(c => ({ label: c.nome, valor: c.total }));
            atualizarGrafico(graficoData);
        }

        // ==========================================
        // 16. RELATÓRIO DE COLABORADORES
        // ==========================================
        function gerarRelatorioColaboradores(servicos, vendas, agendamentos) {
            const colaboradoresMap = {};
            
            servicos.forEach(s => {
                const id = s.collaboratorId;
                if (!colaboradoresMap[id]) {
                    colaboradoresMap[id] = { 
                        nome: getNomeColaborador(id), 
                        servicos: 0, 
                        total: 0, 
                        agendamentos: 0,
                        comissaoTotal: 0
                    };
                }
                colaboradoresMap[id].servicos++;
                const valor = getValor(s, ['value', 'valor']);
                colaboradoresMap[id].total += valor;
                
                // Calcular comissão
                const colab = collaborators.find(c => c.id === id);
                if (colab) {
                    const perc = s.type === 'manual' ? parseFloat(colab.manualPercent || 0) : parseFloat(colab.productPercent || 0);
                    colaboradoresMap[id].comissaoTotal += valor * (perc / 100);
                }
            });

            agendamentos.forEach(a => {
                const id = a.collaboratorId;
                if (!id) return;
                if (!colaboradoresMap[id]) {
                    colaboradoresMap[id] = { 
                        nome: getNomeColaborador(id), 
                        servicos: 0, 
                        total: 0, 
                        agendamentos: 0,
                        comissaoTotal: 0
                    };
                }
                colaboradoresMap[id].agendamentos++;
            });

            const dados = Object.values(colaboradoresMap)
                .sort((a, b) => b.total - a.total)
                .map(c => ({
                    nome: c.nome,
                    servicos: c.servicos,
                    agendamentos: c.agendamentos,
                    total: formatCurrency(c.total),
                    comissao: formatCurrency(c.comissaoTotal)
                }));

            dadosRelatorio = dados;
            renderizarTabela('👤 Relatório de Colaboradores', dados, ['Colaborador', 'Serviços', 'Agendamentos', 'Total Faturado', 'Comissão']);
            document.getElementById('tableInfo').textContent = `${dados.length} colaboradores encontrados`;
            
            const graficoData = Object.values(colaboradoresMap)
                .sort((a, b) => b.total - a.total)
                .map(c => ({ label: c.nome, valor: c.total }));
            atualizarGrafico(graficoData);
        }

        // ==========================================
        // 17. RELATÓRIO FINANCEIRO
        // ==========================================
        function gerarRelatorioFinanceiro(servicos, vendas, despesas, salarios) {
            const totalServicos = servicos.reduce((sum, s) => sum + getValor(s, ['value', 'valor']), 0);
            const totalVendas = vendas.reduce((sum, v) => sum + getValor(v, ['totalValue', 'total', 'value', 'valor']), 0);
            const totalDespesas = despesas.filter(d => d.paid).reduce((sum, d) => sum + getValor(d, ['value', 'valor']), 0);
            const totalSalarios = salarios.reduce((sum, s) => sum + getValor(s, ['totalValue', 'baseValue', 'total']), 0);
            
            const totalReceita = totalServicos + totalVendas;
            const totalGastos = totalDespesas + totalSalarios;
            const lucro = totalReceita - totalGastos;

            const dados = [
                { categoria: 'Receita de Serviços', valor: formatCurrency(totalServicos) },
                { categoria: 'Receita de Produtos', valor: formatCurrency(totalVendas) },
                { categoria: 'Total de Receita', valor: formatCurrency(totalReceita) },
                { categoria: 'Despesas Pagas', valor: formatCurrency(totalDespesas) },
                { categoria: 'Salários Pagos', valor: formatCurrency(totalSalarios) },
                { categoria: 'Total de Gastos', valor: formatCurrency(totalGastos) },
                { categoria: '📈 Lucro Líquido', valor: formatCurrency(lucro) }
            ];

            dadosRelatorio = dados;
            renderizarTabela('💰 Relatório Financeiro', dados, ['Categoria', 'Valor']);
            document.getElementById('tableInfo').textContent = `Período: ${document.getElementById('dataInicio').value} a ${document.getElementById('dataFim').value}`;
            
            const graficoData = [
                { label: 'Receita', valor: totalReceita },
                { label: 'Despesas', valor: totalDespesas },
                { label: 'Salários', valor: totalSalarios },
                { label: 'Lucro', valor: lucro }
            ].filter(d => d.valor > 0 || d.label === 'Lucro');
            atualizarGrafico(graficoData);
        }

        // ==========================================
        // 18. RELATÓRIO DE AGENDA
        // ==========================================
        function gerarRelatorioAgenda(agendamentos) {
            if (agendamentos.length === 0) {
                dadosRelatorio = [];
                renderizarTabela('📅 Relatório de Agenda', [], ['Data', 'Cliente', 'Colaborador', 'Serviço', 'Status']);
                document.getElementById('tableInfo').textContent = 'Nenhum agendamento encontrado';
                atualizarGrafico([]);
                return;
            }

            const statusMap = {
                'scheduled': 'Agendado',
                'confirmed': 'Confirmado',
                'in_progress': 'Em andamento',
                'completed': 'Concluído',
                'cancelled': 'Cancelado',
                'no_show': 'Não compareceu'
            };

            const dados = agendamentos
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .map(a => ({
                    data: formatarData(a.date),
                    cliente: getNomeCliente(a.clientId),
                    colaborador: getNomeColaborador(a.collaboratorId),
                    servico: a.serviceName || a.description || 'Serviço',
                    status: statusMap[a.status] || a.status || 'Agendado'
                }));

            dadosRelatorio = dados;
            renderizarTabela('📅 Relatório de Agenda', dados, ['Data', 'Cliente', 'Colaborador', 'Serviço', 'Status']);
            document.getElementById('tableInfo').textContent = `${agendamentos.length} agendamentos encontrados`;
            
            // Gráfico de status
            const statusCount = {};
            agendamentos.forEach(a => {
                const status = statusMap[a.status] || 'Agendado';
                statusCount[status] = (statusCount[status] || 0) + 1;
            });
            const graficoData = Object.entries(statusCount).map(([label, valor]) => ({ label, valor }));
            atualizarGrafico(graficoData);
        }

        // ==========================================
        // 19. RENDERIZAR TABELA
        // ==========================================
        function renderizarTabela(titulo, dados, colunas) {
            document.getElementById('tableTitle').textContent = titulo;

            if (!dados || dados.length === 0) {
                document.getElementById('tableBody').innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-inbox"></i>
                        <p>Nenhum dado encontrado para o período selecionado.</p>
                        <small class="text-muted">Tente ajustar os filtros.</small>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            ${colunas.map(col => `<th>${col}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            dados.forEach(row => {
                html += '<tr>';
                colunas.forEach(col => {
                    const key = col.toLowerCase().replace(/ /g, '_');
                    const valor = row[key] !== undefined ? row[key] : row[Object.keys(row).find(k => k.toLowerCase().replace(/ /g, '_') === key)] || '-';
                    html += `<td>${valor}</td>`;
                });
                html += '</tr>';
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('tableBody').innerHTML = html;
        }

        // ==========================================
        // 20. ATUALIZAR GRÁFICO
        // ==========================================
        function atualizarGrafico(dados) {
            const ctx = document.getElementById('reportsChart').getContext('2d');
            
            if (reportsChart) {
                reportsChart.destroy();
            }

            if (!dados || dados.length === 0) {
                reportsChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Sem dados'],
                        datasets: [{
                            data: [1],
                            backgroundColor: ['#e9ecef'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
                return;
            }

            const labels = dados.map(d => d.label || d.nome || d.produto || d.categoria || 'Item');
            const valores = dados.map(d => d.valor || d.total || d.quantidade || 0);

            // Gerar cores automaticamente
            const cores = [
                '#26196b', '#ffd700', '#28a745', '#dc3545', '#17a2b8',
                '#fd7e14', '#6f42c1', '#20c997', '#e83e8c', '#ffc107'
            ];

            const backgroundColors = labels.map((_, i) => cores[i % cores.length]);

            // Verificar se são valores monetários ou números
            const isCurrency = dados.some(d => {
                const v = d.valor || d.total || 0;
                return typeof v === 'number' && v > 100;
            });

            const formatValue = (value) => {
                if (isCurrency) return formatCurrency(value);
                return value;
            };

            reportsChart = new Chart(ctx, {
                type: dados.length > 5 ? 'bar' : 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: backgroundColors,
                        borderColor: backgroundColors.map(() => '#ffffff'),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: dados.length > 5 ? 'top' : 'bottom',
                            labels: {
                                boxWidth: 12,
                                padding: 15,
                                font: { size: 11 }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    return context.label + ': ' + (isCurrency ? formatCurrency(value) : value);
                                }
                            }
                        }
                    },
                    scales: dados.length > 5 ? {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return isCurrency ? '€' + value : value;
                                }
                            }
                        }
                    } : undefined
                }
            });
        }

        // ==========================================
        // 21. EXPORTAR PDF
        // ==========================================
        function exportarPDF() {
            if (!dadosRelatorio || dadosRelatorio.length === 0) {
                showToast('Nenhum dado para exportar. Gere um relatório primeiro.', 'warning');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            const pageW = doc.internal.pageSize.getWidth();
            let y = 40;
            const margin = 40;

            // Título
            doc.setFontSize(18);
            doc.setTextColor(38, 25, 107);
            doc.text(configAtual.nome || 'Studio DeVitto', pageW / 2, y, { align: 'center' });
            y += 20;

            doc.setFontSize(14);
            doc.text(document.getElementById('tableTitle').textContent || 'Relatório', pageW / 2, y, { align: 'center' });
            y += 16;

            // Período
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 120);
            const periodo = `Período: ${document.getElementById('dataInicio').value} a ${document.getElementById('dataFim').value}`;
            doc.text(periodo, pageW / 2, y, { align: 'center' });
            y += 20;

            // Tabela
            if (dadosRelatorio.length > 0) {
                const colunas = Object.keys(dadosRelatorio[0]);
                const dadosTabela = dadosRelatorio.map(row => colunas.map(col => String(row[col] || '-')));

                doc.autoTable({
                    startY: y,
                    head: [colunas],
                    body: dadosTabela,
                    theme: 'striped',
                    headStyles: { fillColor: [38, 25, 107] },
                    styles: { fontSize: 8 },
                    columnStyles: {
                        0: { cellWidth: 'auto' }
                    },
                    margin: { left: margin, right: margin }
                });

                y = doc.lastAutoTable.finalY + 20;
            }

            // Rodapé
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 170);
            const rodape = `Documento gerado em ${new Date().toLocaleDateString('pt-PT')} às ${new Date().toLocaleTimeString('pt-PT')}`;
            doc.text(rodape, pageW / 2, doc.internal.pageSize.getHeight() - 20, { align: 'center' });

            doc.save(`relatorio_${document.getElementById('tipoRelatorio').value}_${new Date().toISOString().slice(0,10)}.pdf`);
            showToast('PDF gerado com sucesso!', 'success');
        }

        // ==========================================
        // 22. FUNÇÕES AUXILIARES
        // ==========================================
        function formatarData(data) {
            if (!data) return '';
            if (typeof data === 'string') data = new Date(data);
            return data.toLocaleDateString('pt-PT');
        }

        function formatarDataInput(data) {
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const dia = String(data.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function formatCurrency(value) {
            if (typeof value !== 'number') value = parseFloat(value) || 0;
            return '€ ' + value.toFixed(2).replace('.', ',');
        }

        function showToast(message, type = 'info') {
            if (typeof Swal !== 'undefined') {
                const icons = { 'success': 'success', 'error': 'error', 'warning': 'warning', 'info': 'info' };
                Swal.fire({
                    icon: icons[type] || 'info',
                    title: message,
                    timer: 3000,
                    showConfirmButton: false,
                    toast: true,
                    position: 'top-end',
                    timerProgressBar: true
                });
            } else {
                console.log(`[${type.toUpperCase()}] ${message}`);
            }
        }

        function atualizarUltimaAtualizacao() {
            const now = new Date();
            const el = document.getElementById('lastUpdateBadge');
            if (el) {
                el.innerHTML = `<i class="fas fa-clock me-1"></i>Atualizado ${now.toLocaleTimeString('pt-PT')}`;
            }
        }

        function recarregarDados() {
            carregarTodosOsDados();
            showToast('Dados recarregados!', 'success');
        }

        function goHome() {
            try {
                window.parent.postMessage({ action: 'goHome' }, '*');
            } catch(e) {
                window.location.href = 'layout-index.html';
            }
        }

        function mostrarLoginPrompt() {
            Swal.fire({
                title: 'Acesso Restrito',
                text: 'Faça login para acessar os relatórios.',
                icon: 'warning',
                confirmButtonText: 'Ir para Login',
                showCancelButton: true,
                cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    window.location.href = '/login.html';
                }
            });
        }

        // ==========================================
        // 23. EXPOR FUNÇÕES GLOBAIS
        // ==========================================
        window.goHome = goHome;
        window.recarregarDados = recarregarDados;
        window.gerarRelatorio = gerarRelatorio;
        window.exportarPDF = exportarPDF;

        // ==========================================
        // 24. LOG DE INICIALIZAÇÃO
        // ==========================================
        console.log('✅ Relatórios carregado com sucesso!');
        console.log('📌 Funcionalidades:');
        console.log('   - Relatórios: Geral, Serviços, Produtos, Clientes, Colaboradores, Financeiro, Agenda');
        console.log('   - Filtros por data, colaborador e cliente');
        console.log('   - Gráficos interativos');
        console.log('   - Exportação para PDF');
        console.log('   - Estatísticas rápidas');
        console.log('   - Integração com configurações do sistema');
        console.log('   - PWA para instalação como app');
        console.log('   - Responsivo: Desktop, Tablet, Mobile');

    </script>
