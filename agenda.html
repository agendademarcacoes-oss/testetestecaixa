        function carregarClientesLista() {
            const container = document.getElementById('clientListContainer');
            if (clients.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="fas fa-users fa-3x mb-3 opacity-25"></i>
                        <p>Nenhum cliente cadastrado.</p>
                        <button class="btn btn-sm btn-success" onclick="abrirNovoCliente()">
                            <i class="fas fa-user-plus me-1"></i>Cadastrar Cliente
                        </button>
                    </div>
                `;
                return;
            }
            let html = '';
            clients.forEach(client => {
                const avatarHtml = client.photoUrl ?
                    `<img src="${client.photoUrl}" class="client-avatar" onerror="this.style.display='none'">` :
                    `<div class="client-avatar-placeholder">${(client.name || '?').charAt(0).toUpperCase()}</div>`;
                html += `
                    <div class="client-item" onclick="selecionarClienteLista('${client.id}', '${client.name.replace(/'/g, "\\'")}', '${client.phone || ''}', '${client.photoUrl || ''}')">
                        ${avatarHtml}
                        <div class="client-info">
                            <div class="client-name">${client.name}</div>
                            <div class="client-phone">${client.phone || 'Sem telefone'}</div>
                        </div>
                        <i class="fas fa-chevron-right text-muted"></i>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filtrarClientesLista() {
            const searchTerm = document.getElementById('clientSearchList').value.toLowerCase();
            const items = document.querySelectorAll('.client-item');
            items.forEach(item => {
                const name = item.querySelector('.client-name')?.textContent?.toLowerCase() || '';
                const phone = item.querySelector('.client-phone')?.textContent?.toLowerCase() || '';
                const match = name.includes(searchTerm) || phone.includes(searchTerm);
                item.style.display = match ? '' : 'none';
            });
        }

        function selecionarClienteLista(id, name, phone, photoUrl) {
            document.getElementById('selectedClientId').value = id;
            document.getElementById('selectedClientName').value = name;
            document.getElementById('clientSearch').value = name;
            document.getElementById('clientSelectedInfo').style.display = 'block';
            document.getElementById('clientSelectedName').textContent = name;
            document.getElementById('clientSelectedPhone').textContent = phone || 'Sem telefone';

            const avatar = document.getElementById('clientSelectedAvatar');
            if (photoUrl) {
                avatar.innerHTML =
                `<img src="${photoUrl}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;">`;
            } else {
                avatar.textContent = name.charAt(0).toUpperCase();
                avatar.style.background = 'var(--primary-color)';
            }

            const modal = bootstrap.Modal.getInstance(document.getElementById('clientListModal'));
            if (modal) modal.hide();

        function scrollToCurrentTimeWithVisibility() {
            setTimeout(() => {
                const agora = new Date();
                const horaAtual = agora.getHours();
                const minutoAtual = agora.getMinutes();
                const posicaoTop = (horaAtual * 60) + minutoAtual;

                const agendaContainer = document.getElementById('agendaSlotsContainer');
                if (agendaContainer) {
                    const containerHeight = agendaContainer.clientHeight;
                    const targetPosition = Math.max(0, posicaoTop - (containerHeight / 2) + 30);
                    agendaContainer.scrollTo({
                        top: targetPosition,
                        behavior: 'smooth'
                    });
                    console.log(
                        `📍 Rolando para horário atual: ${horaAtual}:${minutoAtual.toString().padStart(2, '0')} - Posição: ${targetPosition}px`
                        );
                }
            }, 400);
        }

            const perfis = document.getElementById('agendaProfessionals');

            if (!perfis || !agenda) return;
            agenda.addEventListener('scroll', () => { perfis.scrollLeft = agenda.scrollLeft; });
            perfis.addEventListener('scroll', () => { agenda.scrollLeft = perfis.scrollLeft; });
            console.log('✅ Sincronismo de rolagem ativado');

            const agendaHeader = document.querySelector('.agenda-header');

            btnYesterday.className = 'agenda-nav-btn';
            btnYesterday.innerHTML = '<i class="fas fa-chevron-left"></i> Ontem';
            btnYesterday.style.cssText = `
                background: #f8f9fa;
                border: 1px solid #dee2e6;
                border-radius: 20px;
                cursor: pointer;
                transition: all 0.3s;
                color: #333;
            `;
            btnYesterday.onmouseenter = () => btnYesterday.style.background = '#e9ecef';
            btnYesterday.onmouseleave = () => btnYesterday.style.background = '#f8f9fa';
            btnYesterday.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                goToYesterday();
            });

            const btnToday = document.createElement('button');

        function goToYesterday() {
            if (typeof currentAgendaDate !== 'undefined') {
                const yesterday = new Date(currentAgendaDate);
                yesterday.setDate(currentAgendaDate.getDate() - 1);
                currentAgendaDate = yesterday;
                if (typeof updateAgendaDisplay === 'function') {
                    updateAgendaDisplay();
                }
                console.log(`📅 Ontem: ${currentAgendaDate.toLocaleDateString('pt-PT')}`);
                showTemporaryFeedback(`📅 Ontem: ${currentAgendaDate.toLocaleDateString('pt-PT')}`);
            } else {
                console.log('⚠️ currentAgendaDate não definido');
            }
        }

        function goToToday() {
            if (typeof currentAgendaDate !== 'undefined') {
                const now = new Date();
                currentAgendaDate = now;
                if (typeof updateAgendaDisplay === 'function') {
                    updateAgendaDisplay();
                }
                scrollToCurrentTimeWithVisibility();
                console.log(`📅 Hoje: ${currentAgendaDate.toLocaleDateString('pt-PT')} - ${now.toLocaleTimeString('pt-PT')}`);
                showTemporaryFeedback(
                    `📅 Hoje: ${currentAgendaDate.toLocaleDateString('pt-PT')} - ${now.toLocaleTimeString('pt-PT')}`);
            } else {
                console.log('⚠️ currentAgendaDate não definido');
            }
        }

        function goToTomorrow() {
            if (typeof currentAgendaDate !== 'undefined') {
                const tomorrow = new Date(currentAgendaDate);
                tomorrow.setDate(currentAgendaDate.getDate() + 1);
                currentAgendaDate = tomorrow;
                if (typeof updateAgendaDisplay === 'function') {
                    updateAgendaDisplay();
                }
                console.log(`📅 Amanhã: ${currentAgendaDate.toLocaleDateString('pt-PT')}`);
                showTemporaryFeedback(`📅 Amanhã: ${currentAgendaDate.toLocaleDateString('pt-PT')}`);

                    border-radius: 30px;

                    z-index: 10000;
                    font-family: sans-serif;

                document.body.appendChild(feedback);

            feedback.style.opacity = '1';

        let currentCalendarYear = new Date().getFullYear();

                currentCalendarMonth = new Date().getMonth();

        function renderCalendarModal() {
            const container = document.getElementById('calendarModalContainer');
            if (!container) return;

            const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];

            let html = `
                <div class="calendar-header">
                    <button id="calendarPrevMonth" type="button">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="calendar-month-year">${monthNames[currentCalendarMonth]} ${currentCalendarYear}</span>
                    <button id="calendarNextMonth" type="button">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="calendar-weekdays">
                    <div class="calendar-weekday">Dom</div>
                    <div class="calendar-weekday">Seg</div>
                    <div class="calendar-weekday">Ter</div>
                    <div class="calendar-weekday">Qua</div>
                    <div class="calendar-weekday">Qui</div>
                    <div class="calendar-weekday">Sex</div>
                    <div class="calendar-weekday">Sáb</div>
                </div>
                <div class="calendar-days" id="calendarDaysContainer"></div>
            `;

            container.innerHTML = html;
            renderCalendarDays();

            document.getElementById('calendarPrevMonth')?.addEventListener('click', () => {
                currentCalendarMonth--;
                if (currentCalendarMonth < 0) {
                    currentCalendarMonth = 11;
                    currentCalendarYear--;
                }
                renderCalendarModal();
            });

            document.getElementById('calendarNextMonth')?.addEventListener('click', () => {
                currentCalendarMonth++;
                if (currentCalendarMonth > 11) {
                    currentCalendarMonth = 0;
                    currentCalendarYear++;
                }
                renderCalendarModal();
            });
        }

        function renderCalendarDays() {
            const container = document.getElementById('calendarDaysContainer');
            if (!container) return;

            const firstDayOfMonth = new Date(currentCalendarYear, currentCalendarMonth, 1);
            const startDayOfWeek = firstDayOfMonth.getDay();
            const daysInMonth = new Date(currentCalendarYear, currentCalendarMonth + 1, 0).getDate();
            const prevMonthDays = new Date(currentCalendarYear, currentCalendarMonth, 0).getDate();

            const today = new Date();
            const todayStr =
                `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            let currentAgendaDateStr = '';
            if (typeof currentAgendaDate !== 'undefined' && currentAgendaDate) {
                currentAgendaDateStr =
                    `${currentAgendaDate.getFullYear()}-${String(currentAgendaDate.getMonth() + 1).padStart(2, '0')}-${String(currentAgendaDate.getDate()).padStart(2, '0')}`;
            }

            let daysHtml = '';
            let dayCounter = 1;
            let nextMonthCounter = 1;

            for (let i = 0; i < 42; i++) {
                let isCurrentMonth = true;
                let dayNumber = 0;
                let dateStr = '';
                let year = currentCalendarYear;
                let month = currentCalendarMonth;

                if (i < startDayOfWeek) {
                    isCurrentMonth = false;
                    dayNumber = prevMonthDays - (startDayOfWeek - i) + 1;
                    let prevMonth = currentCalendarMonth - 1;
                    let prevYear = currentCalendarYear;
                    if (prevMonth < 0) {
                        prevMonth = 11;
                        prevYear--;
                    }
                    dateStr =
                    `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
                } else if (dayCounter <= daysInMonth) {
                    isCurrentMonth = true;
                    dayNumber = dayCounter;
                    dateStr =
                        `${currentCalendarYear}-${String(currentCalendarMonth + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
                    dayCounter++;
                } else {
                    isCurrentMonth = false;
                    dayNumber = nextMonthCounter;
                    let nextMonth = currentCalendarMonth + 1;
                    let nextYear = currentCalendarYear;
                    if (nextMonth > 11) {
                        nextMonth = 0;
                        nextYear++;
                    }
                    dateStr =
                        `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
                    nextMonthCounter++;
                }

                const isToday = dateStr === todayStr;
                const isSelected = dateStr === currentAgendaDateStr;

                let additionalClass = '';
                if (!isCurrentMonth) additionalClass = 'other-month';
                if (isToday) additionalClass += ' today';
                if (isSelected) additionalClass += ' selected';

                daysHtml += `
                    <div class="calendar-day ${additionalClass}" 
                         data-date="${dateStr}"
                         data-year="${year}"
                         data-month="${month}"
                         data-day="${dayNumber}">
                        ${dayNumber}
                    </div>
                `;
            }

            container.innerHTML = daysHtml;

            document.querySelectorAll('#calendarDaysContainer .calendar-day').forEach(dayEl => {
                dayEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const dateStr = this.getAttribute('data-date');
                    if (dateStr) {
                        selectDateFromCalendar(dateStr);
                    }
                });
            });
        }

        function selectDateFromCalendar(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const selectedDate = new Date(year, month - 1, day);

            if (typeof currentAgendaDate !== 'undefined') {
                currentAgendaDate = selectedDate;
                if (typeof updateAgendaDisplay === 'function') {
                    updateAgendaDisplay();
                }
                console.log(`📅 Data selecionada: ${selectedDate.toLocaleDateString('pt-PT')}`);
            }

            const modal = bootstrap.Modal.getInstance(document.getElementById('datePickerModal'));
            if (modal) modal.hide();
            showTemporaryFeedback(`📅 Data alterada para ${selectedDate.toLocaleDateString('pt-PT')}`);
        }

        // ==========================================
        // 24. SINCRONIZAÇÃO EM TEMPO REAL
        // ==========================================
        function initRealtimeSync() {
            if (!currentUser) return;
            console.log('🔄 Iniciando sincronização em tempo real para agendamentos...');

            if (appointmentsRealtimeListener) appointmentsRealtimeListener();

            appointmentsRealtimeListener = db.collection('appointments')
                .where('userId', '==', currentUser.uid)
                .onSnapshot((snapshot) => {
                    console.log('📡 [REALTIME] Agendamentos atualizados!');
                    snapshot.docChanges().forEach((change) => {
                        const data = { id: change.doc.id, ...change.doc.data() };
                        switch (change.type) {
                            case 'added':
                                if (!appointments.some(a => a.id === data.id)) {
                                    appointments.push(data);
                                    showRealtimeNotification(`➕ Novo: ${data.clientName}`);
                                }
                                break;
                            case 'modified':
                                const idx = appointments.findIndex(a => a.id === data.id);
                                if (idx !== -1) appointments[idx] = data;
                                else appointments.push(data);
                                showRealtimeNotification(`✏️ Atualizado: ${data.clientName}`);
                                break;
                            case 'removed':
                                const rmIdx = appointments.findIndex(a => a.id === data.id);
                                if (rmIdx !== -1) appointments.splice(rmIdx, 1);
                                showRealtimeNotification(`🗑️ Agendamento removido`);
                                break;
                        }
                    });
                    refreshAfterRealtime();
                }, (error) => {
                    console.error('❌ Erro no listener de agendamentos:', error);
                });

            console.log('✅ Sincronização em tempo real ativada para agendamentos');
        }

        function refreshAfterRealtime() {
            if (typeof renderAppointmentsForAll === 'function') renderAppointmentsForAll();
            if (typeof updateDashboard === 'function') updateDashboard();
            if (typeof updateFinancialSummary === 'function') updateFinancialSummary();
        }

        let notificationTimeout = null;

        function showRealtimeNotification(message) {
            let notif = document.getElementById('realtimeNotification');
            if (!notif) {
                notif = document.createElement('div');
                notif.id = 'realtimeNotification';
                notif.style.cssText = `
                    position: fixed; bottom: 80px; right: 20px;
                    background: linear-gradient(135deg, #28a745, #20c997);
                    color: white; padding: 10px 20px; border-radius: 30px;
                    font-size: 13px; z-index: 1000000;

                    transition: opacity 0.3s ease; opacity: 0; pointer-events: none; white-space: nowrap;
                `;
                document.body.appendChild(notif);
            }
            notif.textContent = `🔄 ${message}`;
            notif.style.opacity = '1';
            if (notificationTimeout) clearTimeout(notificationTimeout);
            notificationTimeout = setTimeout(() => { notif.style.opacity = '0'; }, 2000);
        }
