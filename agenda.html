        function carregarServicosLista() {
            const container = document.getElementById('serviceListContainer');

            const servicos = companyServices.length > 0 ? companyServices : [
                { id: 'corte', name: 'Corte' },
                { id: 'coloração', name: 'Coloração' },
                { id: 'hidratação', name: 'Hidratação' },
                { id: 'escova', name: 'Escova' },
                { id: 'manicure', name: 'Manicure' },
                { id: 'pedicure', name: 'Pedicure' },
                { id: 'maquiagem', name: 'Maquiagem' },
                { id: 'depilação', name: 'Depilação' }
            ];

            if (servicos.length === 0) {
                container.innerHTML = `
                        <div class="text-center text-muted py-4">
                            <i class="fas fa-cut fa-3x mb-3 opacity-25"></i>
                            <p>Nenhum serviço cadastrado.</p>
                            <button class="btn btn-sm btn-primary" onclick="irParaServicos()">
                                <i class="fas fa-plus me-1"></i>Cadastrar Serviços
                            </button>
                        </div>
                    `;
                return;
            }

            let html = '';
            const cores = ['#26196b', '#e74c3c', '#27ae60', '#f39c12', '#2980b9', '#8e44ad', '#1abc9c', '#e67e22'];

            servicos.forEach((servico, index) => {
                const isSelected = selectedServices.some(s => s.id === servico.id);
                const cor = cores[index % cores.length];

                html += `
                        <div class="service-item-select" onclick="toggleServicoSelecao('${servico.id}', '${servico.name.replace(/'/g, "\\'")}')">
                            <div class="service-color-bar" style="background:${cor};"></div>
                            <div class="service-info">
                                <div class="service-name">${servico.name}</div>
                                <div class="service-price">${servico.price ? `€ ${servico.price.toFixed(2)}` : ''}</div>
                            </div>
                            <div class="service-check">
                                ${isSelected ? '<i class="fas fa-check-circle text-success"></i>' : ''}
                            </div>
                        </div>
                    `;
            });

            container.innerHTML = html;
        }

        function filtrarServicosLista() {
            const searchTerm = document.getElementById('serviceSearchList').value.toLowerCase();
            const items = document.querySelectorAll('.service-item-select');
            items.forEach(item => {
                const name = item.querySelector('.service-name')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(searchTerm) ? '' : 'none';
            });
        }

        function toggleServicoSelecao(id, name) {
            const index = selectedServices.findIndex(s => s.id === id);
            if (index === -1) {
                selectedServices.push({ id, name });
            } else {
                selectedServices.splice(index, 1);
            }
            atualizarListaServicosSelecionados();
            atualizarTotal();
            carregarServicosLista();
        }

        function limparServicos() {
            selectedServices = [];
            atualizarListaServicosSelecionados();
            atualizarTotal();
        }

        function atualizarListaServicosSelecionados() {
            const container = document.getElementById('selectedServicesList');

            if (selectedServices.length === 0) {
                container.innerHTML =
                    '<p class="text-muted text-center py-2" style="font-size:0.85rem;">Nenhum serviço adicionado</p>';
                return;
            }

            const cores = ['#26196b', '#e74c3c', '#27ae60', '#f39c12', '#2980b9', '#8e44ad', '#1abc9c', '#e67e22'];
            let html = '';
            selectedServices.forEach((servico, index) => {
                const cor = cores[index % cores.length];
                html += `
                        <div class="selected-service-item">
                            <div class="service-color" style="background:${cor};"></div>
                            <div class="service-name">${servico.name}</div>
                            <div class="service-price">${servico.price ? `€ ${servico.price.toFixed(2)}` : ''}</div>
                            <button class="btn-remove" onclick="removerServicoSelecionado('${servico.id}')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
            });

            container.innerHTML = html;
        }

        function removerServicoSelecionado(id) {
            selectedServices = selectedServices.filter(s => s.id !== id);
            atualizarListaServicosSelecionados();
            atualizarTotal();
        }

        function irParaServicos() {
            const modal = bootstrap.Modal.getInstance(document.getElementById('serviceListModal'));
            if (modal) modal.hide();
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'irParaEmpresa' }, '*');
            }
        }

        // ==========================================
        // 23. ATUALIZAR TOTAL
        // ==========================================
        function atualizarTotal() {
            const total = selectedServices.reduce((sum, s) => sum + (s.price || 0), 0);
            document.getElementById('appointmentTotal').textContent = `€ ${total.toFixed(2).replace('.', ',')}`;
        }

        // ==========================================
        // 24. SALVAR AGENDAMENTO
        // ==========================================
        function salvarAgendamento() {
            const clientId = document.getElementById('selectedClientId').value;
            const date = document.getElementById('appointmentDate').value;
            const time = document.getElementById('appointmentTime').value;
            const collaboratorId = document.getElementById('appointmentCollaborator').value;
            const notes = document.getElementById('appointmentNotes').value;
            const status = document.getElementById('appointmentStatus').value;
            const appointmentId = document.getElementById('appointmentId').value;

            if (!clientId) {
                Swal.fire('Aviso', 'Selecione um cliente.', 'warning');
                return;
            }

            if (!date || !time) {
                Swal.fire('Aviso', 'Preencha data e hora.', 'warning');
                return;
            }

            if (!collaboratorId) {
                Swal.fire('Aviso', 'Selecione um profissional.', 'warning');
                return;
            }

            if (selectedServices.length === 0) {
                Swal.fire('Aviso', 'Adicione pelo menos um serviço.', 'warning');
                return;
            }

            const client = clients.find(c => c.id === clientId);
            const serviceNames = selectedServices.map(s => s.name).join(', ');
            const totalDuration = selectedServices.length * 30; // 30 min por serviço
            const totalValue = selectedServices.reduce((sum, s) => sum + (s.price || 0), 0);

            // Calcular hora de fim
            const [startHour, startMinute] = time.split(':').map(Number);
            const totalMinutes = startHour * 60 + startMinute + totalDuration;
            const endHour = Math.floor(totalMinutes / 60) % 24;
            const endMinute = totalMinutes % 60;
            const endTime = `${endHour.toString().padStart(2, '0')}:${endMinute.toString().padStart(2, '0')}`;

            const appointmentData = {
                clientId: clientId,
                clientName: client ? client.name : 'Cliente',
                clientPhone: client ? client.phone || '' : '',
                date: date,
                startTime: time,
                endTime: endTime,
                duration: totalDuration,
                services: selectedServices,
                serviceName: serviceNames,
                total: totalValue,
                collaboratorId: collaboratorId,
                notes: notes,
                status: status || 'scheduled',
                userId: currentUser.uid,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            let promise;
            if (appointmentId) {
                promise = db.collection('appointments').doc(appointmentId).update(appointmentData);
            } else {
                appointmentData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                promise = db.collection('appointments').add(appointmentData);
            }

            Swal.fire({
                title: 'Salvando...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            promise
                .then(() => {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('appointmentModal'));
                    if (modal) modal.hide();
                    return carregarAgendamentos();
                })
                .then(() => {
                    renderizarAgenda();
                    Swal.fire({
                        icon: 'success',
                        title: '✅ Agendamento salvo!',
                        timer: 1500,
                        showConfirmButton: false
                    });
                })
                .catch(error => {
                    Swal.fire('Erro', 'Erro ao salvar agendamento: ' + error.message, 'error');
                });
        }

        // ==========================================
        // 25. EXCLUIR AGENDAMENTO
        // ==========================================
        function excluirAgendamento() {
            const appointmentId = document.getElementById('appointmentId').value;
            if (!appointmentId) return;

            Swal.fire({
                title: 'Excluir Agendamento?',
                text: 'Esta ação não pode ser desfeita.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Sim, excluir',
                cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    db.collection('appointments').doc(appointmentId).delete()
                        .then(() => {
                            const modal = bootstrap.Modal.getInstance(document.getElementById(
                            'appointmentModal'));
                            if (modal) modal.hide();
                            return carregarAgendamentos();
                        })
                        .then(() => {
                            renderizarAgenda();
                            Swal.fire('✅ Agendamento excluído!', '', 'success');
                        })
                        .catch(error => {
                            Swal.fire('Erro', 'Erro ao excluir: ' + error.message, 'error');
                        });
                }
            });
        }

        // ==========================================
        // 26. REFRESH
        // ==========================================
        function refreshAgenda() {
            const btn = document.getElementById('refreshBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Carregando...';
            btn.disabled = true;

            carregarDados().then(() => {
                btn.innerHTML = '<i class="fas fa-check me-1"></i>Atualizado!';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-sync-alt me-1"></i>Atualizar';
                    btn.disabled = false;
                }, 1500);
                Swal.fire('✅ Agenda atualizada!', '', 'success');
            }).catch(() => {
                btn.innerHTML = '<i class="fas fa-sync-alt me-1"></i>Atualizar';
                btn.disabled = false;
            });
        }

        // ==========================================
        // 27. ATUALIZAR ÚLTIMA ATUALIZAÇÃO
        // ==========================================
        function atualizarUltimaAtualizacao() {
            const now = new Date();
            const el = document.getElementById('lastUpdateBadge');
            if (el) {
                el.innerHTML = `<i class="fas fa-clock me-1"></i>Atualizado ${now.toLocaleTimeString('pt-PT')}`;
            }
        }

        // ==========================================
        // 28. MOSTRAR LOGIN PROMPT
        // ==========================================
        function mostrarLoginPrompt() {
            Swal.fire({
                title: 'Acesso Restrito',
                text: 'Faça login para visualizar a agenda.',
                icon: 'warning',
                confirmButtonText: 'Ir para Login',
                showCancelButton: true,
                cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    window.location.href = '/login.html';
                }
            });
        }

        // ==========================================
        // 29. EXPOR FUNÇÕES GLOBAIS
        // ==========================================
        window.goHome = goHome;
        window.refreshAgenda = refreshAgenda;
        window.navegarAgenda = navegarAgenda;
        window.irParaHoje = irParaHoje;
        window.mudarVisualizacao = mudarVisualizacao;
        window.abrirDatePicker = abrirDatePicker;
        window.mudarMesCalendario = mudarMesCalendario;
        window.selecionarDataCalendario = selecionarDataCalendario;
        window.abrirSelecionarCliente = abrirSelecionarCliente;
        window.abrirNovoCliente = abrirNovoCliente;
        window.salvarNovoCliente = salvarNovoCliente;
        window.filtrarClientesLista = filtrarClientesLista;
        window.selecionarClienteLista = selecionarClienteLista;
        window.abrirSelecionarServico = abrirSelecionarServico;
        window.filtrarServicosLista = filtrarServicosLista;
        window.toggleServicoSelecao = toggleServicoSelecao;
        window.removerServicoSelecionado = removerServicoSelecionado;
        window.limparServicos = limparServicos;

        // ==========================================
        // 30. LOG DE INICIALIZAÇÃO
        // ==========================================
        console.log('✅ Agenda carregada com sucesso!');
        console.log('📌 Funcionalidades:');
        console.log('   - Visualização por Dia, 3 dias e Semana');
        console.log('   - Seleção de profissional');
        console.log('   - Criação e edição de agendamentos');
        console.log('   - Seleção de clientes');
        console.log('   - Adição de serviços');
        console.log('   - DatePicker para navegação');
        console.log('   - Linha do tempo atual');
        console.log('   - Responsivo para mobile');
    </script>
</body>
