<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio DeVitto - Carregando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #26196b, #4a3a9c);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .loading-container {
            text-align: center;
            color: white;
            padding: 20px;
        }
        
        .loading-container .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 0.8s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-container h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .loading-container p {
            opacity: 0.8;
            font-size: 0.9rem;
        }
        
        .loading-container .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ffd700;
        }
    </style>
    <script>
        // Redirecionamento automático para o layout-index.html
        (function() {
            // Verificar se já está no arquivo correto
            var pathname = window.location.pathname;
            var filename = pathname.substring(pathname.lastIndexOf('/') + 1);
            
            // Se a página atual não for layout-index.html, redirecionar
            if (filename !== 'layout-index.html' && filename !== '') {
                console.log('🔀 Redirecionando para layout-index.html');
                window.location.href = 'layout-index.html';
            } else if (filename === '') {
                // Se for a raiz, redirecionar para layout-index.html
                console.log('🔀 Redirecionando da raiz para layout-index.html');
                window.location.href = 'layout-index.html';
            }
        })();
    </script>
</head>
<body>
    <div class="loading-container">
        <div class="icon">✂️</div>
        <div class="spinner"></div>
        <h1>Studio DeVitto</h1>
        <p>Carregando sistema...</p>
    </div>
</body>
</html>
