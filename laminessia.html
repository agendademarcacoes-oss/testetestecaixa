<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anamnese - Studio DeVitto</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <!-- Cloudinary SDK -->
    <script src="https://upload-widget.cloudinary.com/global.js"></script>
    
    <style>
        :root {
            --primary-color: #26196b;
            --primary-light: #4a3a9c;
            --primary-dark: #1a0f4a;
            --secondary-color: #ffd700;
            --bg-light: #f0edf7;
            --card-shadow: 0 4px 20px rgba(38, 25, 107, 0.08);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            box-sizing: border-box !important;
        }
        
        html, body {
            touch-action: pan-x pan-y !important;
            -webkit-text-size-adjust: 100% !important;
            text-size-adjust: 100% !important;
            overflow: hidden !important;
            height: 100% !important;
            width: 100% !important;
            position: fixed !important;
            overflow-y: auto !important;
            background: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #e8e4f0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }

        .app-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(38,25,107,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 60px;
        }

        .app-header .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header .header-brand .brand-icon {
            font-size: 1.4rem;
            color: var(--secondary-color);
        }

        .app-header .header-brand .brand-name {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .app-header .header-brand .brand-sub {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 6px;
        }

        .app-header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .app-header .header-actions .user-greeting {
            font-size: 0.7rem;
            opacity: 0.8;
            padding: 4px 12px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
            white-space: nowrap;
        }

        .btn-header {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            border-radius: 25px;
            padding: 5px 14px;
            font-size: 0.75rem;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-header:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .app-container {
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 16px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .app-toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .app-toolbar .toolbar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .app-toolbar .toolbar-row .search-wrapper {
            flex: 1;
            position: relative;
            min-width: 200px;
        }

        .app-toolbar .toolbar-row .search-wrapper input {
            width: 100%;
            padding: 10px 40px 10px 44px;
            border: 2px solid #e0dce8;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
            transition: var(--transition);
            outline: none;
        }

        .app-toolbar .toolbar-row .search-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(38,25,107,0.1);
        }

        .app-toolbar .toolbar-row .search-wrapper .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a84a0;
        }

        .app-toolbar .toolbar-row .search-wrapper .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8a84a0;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            display: none;
            border-radius: 50%;
            transition: var(--transition);
        }

        .app-toolbar .toolbar-row .search-wrapper .clear-btn:hover {
            background: #f0edf7;
        }

        .app-toolbar .toolbar-row .search-wrapper .clear-btn.visible {
            display: block;
        }

        .app-toolbar .toolbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .btn-toolbar {
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            white-space: nowrap;
        }

        .btn-toolbar.primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-toolbar.primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(38,25,107,0.3);
        }

        .btn-toolbar.success {
            background: #28a745;
            color: white;
        }

        .btn-toolbar.success:hover {
            background: #1e7e34;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(40,167,69,0.3);
        }

        .btn-toolbar.info {
            background: #17a2b8;
            color: white;
        }

        .btn-toolbar.info:hover {
            background: #0f7a8a;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(23,162,184,0.3);
        }

        .app-toolbar .info-hint {
            font-size: 0.75rem;
            color: #8a84a0;
            font-style: italic;
            padding: 2px 0;
        }

        .cards-grid {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 0 8px;
        }

        .cards-grid .cards-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .ficha-card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }

        .ficha-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(38,25,107,0.12);
        }

        .ficha-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(38,25,107,0.12);
        }

        .ficha-card .card-top {
            padding: 14px 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 56px;
        }

        .ficha-card .card-top .card-icon {
            font-size: 1.3rem;
            width: 32px;
            text-align: center;
        }

        .ficha-card .card-top .card-title {
            font-weight: 600;
            font-size: 0.9rem;
            flex: 1;
        }

        .ficha-card .card-top .card-badge {
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .ficha-card .card-body {
            padding: 12px 16px;
        }

        .ficha-card .card-body .card-desc {
            font-size: 0.8rem;
            color: #6a6480;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .ficha-card .card-body .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .ficha-card .card-body .card-tags .tag {
            background: #f0edf7;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            color: var(--primary-color);
        }

        .ficha-card .card-body .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid #f0edf7;
            font-size: 0.7rem;
            color: #8a84a0;
        }

        .ficha-card .card-body .card-footer .card-select {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ficha-card .card-body .card-footer .card-select input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .ficha-modal .modal-content {
            border-radius: var(--radius);
            overflow: hidden;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .ficha-modal .modal-dialog {
            max-width: 900px;
            margin: 20px auto;
        }

        .ficha-modal .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            padding: 16px 24px;
        }

        .ficha-modal .modal-header .btn-close {
            filter: brightness(0) invert(1);
            opacity: 0.7;
            transition: var(--transition);
        }

        .ficha-modal .modal-header .btn-close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }

        .ficha-modal .modal-body {
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .ficha-modal .modal-footer {
            padding: 16px 24px;
            background: #f8f7fa;
            border-top: 1px solid #e8e4f0;
        }

        .form-section {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e8e4f0;
        }

        .form-section .section-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary-color);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section .section-title .title-icon {
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #3a3450;
            margin-bottom: 4px;
            display: block;
        }

        .form-group .form-label .required {
            color: #dc3545;
            margin-left: 2px;
        }

        .form-group .form-control,
        .form-group .form-select {
            border-radius: 10px;
            border: 2px solid #e8e4f0;
            font-size: 0.9rem;
            padding: 8px 14px;
            transition: var(--transition);
        }

        .form-group .form-control:focus,
        .form-group .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(38,25,107,0.08);
        }

        .form-group .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding-top: 4px;
        }

        .form-group .checkbox-group .form-check {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .form-group .checkbox-group .form-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .form-group .checkbox-group .form-check label {
            font-size: 0.85rem;
            cursor: pointer;
            margin: 0;
        }

        .alert-info-custom {
            background: #e8f0fe;
            border-left: 4px solid var(--primary-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #2a2450;
        }

        .alert-info-custom strong {
            color: var(--primary-color);
        }

        .client-search-wrapper {
            position: relative;
        }

        .client-search-wrapper input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            border: 2px solid #e8e4f0;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: var(--transition);
            background: white;
        }

        .client-search-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(38,25,107,0.08);
        }

        .client-search-wrapper .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a84a0;
        }

        .client-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border: 2px solid #e8e4f0;
            border-radius: 12px;
            z-index: 1050;
            display: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .client-dropdown.show {
            display: block;
        }

        .client-dropdown .client-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #f0edf7;
            cursor: pointer;
            transition: var(--transition);
            gap: 12px;
        }

        .client-dropdown .client-item:last-child {
            border-bottom: none;
        }

        .client-dropdown .client-item:hover {
            background: #f8f7fa;
        }

        .client-dropdown .client-item.selected {
            background: #e8f0fe;
            border-left: 4px solid var(--primary-color);
        }

        .client-dropdown .client-item .client-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
        }

        .client-dropdown .client-item .client-info {
            flex: 1;
            min-width: 0;
        }

        .client-dropdown .client-item .client-info .client-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .client-dropdown .client-item .client-info .client-contact {
            font-size: 0.75rem;
            color: #8a84a0;
        }

        .client-dropdown .client-item .client-check {
            color: #28a745;
            font-size: 1.1rem;
            display: none;
        }

        .client-dropdown .client-item.selected .client-check {
            display: block;
        }

        .client-dropdown .no-results {
            padding: 20px;
            text-align: center;
            color: #8a84a0;
        }

        .client-dropdown .client-loading {
            padding: 18px;
            text-align: center;
            color: #8a84a0;
        }

        .client-dropdown .client-create-inline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 14px;
            border-top: 1px solid #f0edf7;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            background: #faf9fd;
        }

        .client-dropdown .client-create-inline:hover {
            background: #f0edf7;
        }

        .btn-create-client {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2px dashed #d8d4e0;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            color: #6a6480;
            margin-top: 8px;
            background: white;
        }

        .btn-create-client:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: #f8f7fa;
        }

        .signature-area {
            border: 2px solid #e8e4f0;
            border-radius: 12px;
            padding: 8px;
            background: white;
            touch-action: none;
            min-height: 140px;
            position: relative;
        }

        .signature-area canvas {
            width: 100%;
            height: 140px;
            touch-action: none;
            border-radius: 8px;
        }

        .signature-area .signature-label {
            position: absolute;
            top: -10px;
            left: 14px;
            background: white;
            padding: 0 8px;
            font-size: 0.7rem;
            color: #8a84a0;
            font-weight: 600;
        }

        .signature-area .clear-signature {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(220,53,69,0.08);
            border: none;
            color: #dc3545;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .signature-area .clear-signature:hover {
            background: rgba(220,53,69,0.15);
        }

        .cuidados-box {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 14px 18px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .cuidados-box strong {
            color: #856404;
        }

        .cuidados-box ul {
            margin: 8px 0 0 20px;
            padding: 0;
        }

        .cuidados-box ul li {
            color: #6c5200;
            margin-bottom: 4px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #f8f7fa;
            cursor: pointer;
            border: 2px solid #e8e4f0;
            transition: var(--transition);
        }

        .photo-item:hover {
            border-color: var(--primary-color);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-item .photo-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(220,53,69,0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .photo-item .photo-remove:hover {
            transform: scale(1.1);
        }

        .photo-upload-area {
            border: 2px dashed #d8d4e0;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .photo-upload-area:hover {
            border-color: var(--primary-color);
            background: #f8f7fa;
        }

        .photo-upload-area i {
            font-size: 2rem;
            color: #8a84a0;
            margin-bottom: 6px;
        }

        .ficha-list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0edf7;
            cursor: pointer;
            transition: var(--transition);
            gap: 14px;
        }

        .ficha-list-item:hover {
            background: #f8f7fa;
        }

        .ficha-list-item .ficha-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
            font-size: 16px;
        }

        .ficha-list-item .ficha-info {
            flex: 1;
            min-width: 0;
        }

        .ficha-list-item .ficha-info .ficha-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .ficha-list-item .ficha-info .ficha-meta {
            font-size: 0.75rem;
            color: #8a84a0;
        }

        .ficha-list-item .ficha-status {
            font-size: 0.65rem;
            padding: 3px 14px;
            border-radius: 20px;
            font-weight: 500;
        }

        .ficha-list-item .ficha-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .ficha-list-item .ficha-status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .ficha-list-item .ficha-actions {
            display: flex;
            gap: 6px;
        }

        .ficha-list-item .ficha-actions .btn-icon {
            background: none;
            border: none;
            color: #8a84a0;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .ficha-list-item .ficha-actions .btn-icon:hover {
            background: #f0edf7;
            color: var(--primary-color);
        }

        @media (max-width: 992px) {

        // ============================================================
        // CARREGAR CONFIGURAÇÕES
        // ============================================================
        function carregarConfiguracoes() {
            try {
                const config = localStorage.getItem('systemConfig');
                if (config) {
                    const parsed = JSON.parse(config);
                    if (parsed.corPrimaria) {
                        document.documentElement.style.setProperty('--primary-color', parsed.corPrimaria);
                        document.documentElement.style.setProperty('--primary-light', parsed.corPrimaria + '99');
                        const header = document.getElementById('appHeader');
                        if (header) {
                            header.style.background = `linear-gradient(135deg, ${parsed.corPrimaria}, ${parsed.corPrimaria}99)`;
                        }
                    }
                    if (parsed.logo) {
                        const brand = document.querySelector('.header-brand');
                        if (brand) {
                            brand.innerHTML = `
                                <img src="${parsed.logo}" style="height:32px;width:32px;border-radius:50%;object-fit:cover;margin-right:6px;" alt="Logo">
                                <span class="brand-name">Anamnese</span>
                                <span class="brand-sub">Studio DeVitto</span>
                            `;
                        }
                    }
                }
            } catch(e) {}
        }

        // ============================================================
        // CARREGAR DADOS
        // ============================================================
        function carregarDados() {
            if (!currentUser) return;
            
            db.collection('clients')
                .where('userId', '==', currentUser.uid)
                .get()
                .then(snapshot => {
                    clients = [];
                    snapshot.forEach(doc => {
                        clients.push({ id: doc.id, ...doc.data() });
                    });
                    clients.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    atualizarUltimaAtualizacao();
                })
                .catch(error => console.error('Erro ao carregar clientes:', error));

            db.collection('anamneses')
                .where('userId', '==', currentUser.uid)
                .get()
                .then(snapshot => {
                    anamneses = [];
                    snapshot.forEach(doc => {
                        anamneses.push({ id: doc.id, ...doc.data() });
                    });
                    anamneses.sort((a, b) => {
                        const dateA = a.createdAt ? new Date(a.createdAt) : new Date(0);
                        const dateB = b.createdAt ? new Date(b.createdAt) : new Date(0);
                        return dateB - dateA;
                    });
                    atualizarUltimaAtualizacao();
                })
                .catch(error => console.error('Erro ao carregar anamneses:', error));
        }

        function atualizarUltimaAtualizacao() {
            const now = new Date();
            const el = document.getElementById('updateTime');
            if (el) {
                el.textContent = `Atualizado ${now.toLocaleTimeString('pt-PT')}`;
            }

                    return item.nome.toLowerCase().includes(searchTerm) ||
                           item.descricao.toLowerCase().includes(searchTerm);
                });

            filteredTypes.forEach(key => {

                const cor = item.cor || '#26196b';

                html += `
                    <div class="ficha-card ${isSelected ? 'selected' : ''}" 
                         data-ficha-id="${key}"

        // ============================================================
        // FILTRO DINÂMICO DE CLIENTES
        // ============================================================
        function normalizarTexto(texto) {
            return String(texto || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim();
        }

        function escaparHtml(texto) {
            return String(texto || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderClientesSwal(inputId, dropdownId) {
            const input = document.getElementById(inputId);
            const dropdown = document.getElementById(dropdownId);
            if (!input || !dropdown) return;

            const searchTerm = normalizarTexto(input.value);

            // Não mostrar a lista de clientes enquanto o campo estiver vazio.
            // A lista só é aberta depois que o usuário começar a digitar.
            if (!searchTerm) {
                dropdown.innerHTML = '';
                dropdown.classList.remove('show');
                return;
            }

            const resultados = clients
                .filter(c => {
                    const nome = normalizarTexto(c.name);
                    const telefone = normalizarTexto(c.phone);
                    const email = normalizarTexto(c.email);
                    return nome.includes(searchTerm) || telefone.includes(searchTerm) || email.includes(searchTerm);
                })
                .slice(0, 80);

            if (resultados.length === 0) {
                dropdown.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-user-slash mb-2"></i>
                        <div>Nenhum cliente encontrado</div>
                        ${searchTerm ? `<div class="small mt-1">Você pode criar um novo cliente abaixo.</div>` : ''}
                    </div>
                    <div class="client-create-inline" onclick="window.abrirNovoCliente(); Swal.close();">
                        <i class="fas fa-user-plus"></i> Criar novo cliente
                    </div>
                `;
                dropdown.classList.add('show');
                return;
            }

            dropdown.innerHTML = resultados.map(c => {
                const nome = escaparHtml(c.name || 'Cliente');
                const telefone = escaparHtml(c.phone || 'Sem telefone');
                const email = c.email ? ` | ${escaparHtml(c.email)}` : '';
                const inicial = escaparHtml((c.name || 'C').charAt(0).toUpperCase());
                const avatar = c.photoUrl
                    ? `<img src="${escaparHtml(c.photoUrl)}" class="client-avatar" onerror="this.outerHTML='<div class="client-avatar">${inicial}</div>'">`
                    : `<div class="client-avatar">${inicial}</div>`;
                return `
                    <div class="client-item ${selectedClientId === c.id ? 'selected' : ''}" data-client-id="${escaparHtml(c.id)}" onclick="selecionarCliente('${String(c.id).replace(/'/g, "\\'")}')">
                        ${avatar}
                        <div class="client-info">
                            <div class="client-name">${nome}</div>
                            <div class="client-contact">${telefone}${email}</div>
                        </div>
                        <div class="client-check"><i class="fas fa-check-circle"></i></div>
                    </div>
                `;
            }).join('');

            dropdown.classList.add('show');
        }

        function filtrarClientesSwal() {
            renderClientesSwal('swalClientSearch', 'swalClientDropdown');
        }

        function filtrarClientesSwal2() {
            renderClientesSwal('swalClientSearch2', 'swalClientDropdown2');
        }

        function selecionarCliente(clientId) {
            document.querySelectorAll('.client-dropdown .client-item').forEach(el => {
                el.classList.remove('selected');
            });
            
            const item = document.querySelector(`.client-dropdown .client-item[data-client-id="${clientId}"]`);
            if (item) {
                item.classList.add('selected');
                selectedClientId = clientId;
                const dropdown = item.closest('.client-dropdown');
                if (dropdown) dropdown.classList.remove('show');
            }
        }

        function previewNovoClienteFoto(event) {
            const file = event.target.files[0];

                const preview = document.getElementById('novoClienteFotoPreview');
                preview.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
                
                Swal.fire({
                    title: 'Enviando foto...',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });

                uploadImageToCloudinary(file)
                    .then(url => {
                        fotoUrl = url;
                        Swal.close();
                        showSuccess('Foto enviada com sucesso!');
                    })
                    .catch(error => {

        // ============================================================
        // ASSINATURAS
        // ============================================================
        function initSignaturePads() {
            const clientCanvas = document.getElementById('signatureClientCanvas');
            if (clientCanvas) {
                const ctx = clientCanvas.getContext('2d');
                ctx.clearRect(0, 0, clientCanvas.width, clientCanvas.height);
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, clientCanvas.width, clientCanvas.height);

                if (signaturePadClient) {
                    signaturePadClient.clear();
                    signaturePadClient = null;
                }

                if (typeof SignaturePad !== 'undefined') {
                    signaturePadClient = new SignaturePad(clientCanvas, {
                        backgroundColor: 'white',
                        penColor: '#26196b',
                        minWidth: 1.5,
                        maxWidth: 3,
                        velocityFilterWeight: 0.7
                    });
                } else {
                    setupManualSignature(clientCanvas, 'client');
                }
            }

            const professionalCanvas = document.getElementById('signatureProfessionalCanvas');
            if (professionalCanvas) {
                const ctx = professionalCanvas.getContext('2d');
                ctx.clearRect(0, 0, professionalCanvas.width, professionalCanvas.height);
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, professionalCanvas.width, professionalCanvas.height);

                if (signaturePadProfessional) {
                    signaturePadProfessional.clear();
                    signaturePadProfessional = null;
                }

                if (typeof SignaturePad !== 'undefined') {
                    signaturePadProfessional = new SignaturePad(professionalCanvas, {
                        backgroundColor: 'white',
                        penColor: '#26196b',
                        minWidth: 1.5,
                        maxWidth: 3,
                        velocityFilterWeight: 0.7
                    });
                } else {
                    setupManualSignature(professionalCanvas, 'professional');
                }
            }
        }

        function setupManualSignature(canvas, type) {
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#26196b';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let clientX, clientY;

                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startDraw(e) {
                e.preventDefault();
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            }

            function draw(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            }

            function endDraw(e) {
                e.preventDefault();
                isDrawing = false;
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);

            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', endDraw, { passive: false });

            canvas._cleanup = function() {
                canvas.removeEventListener('mousedown', startDraw);
                canvas.removeEventListener('mousemove', draw);
                canvas.removeEventListener('mouseup', endDraw);
                canvas.removeEventListener('mouseleave', endDraw);
                canvas.removeEventListener('touchstart', startDraw);
                canvas.removeEventListener('touchmove', draw);
                canvas.removeEventListener('touchend', endDraw);
            };
        }

        function limparAssinatura(type) {
            const canvasId = type === 'client' ? 'signatureClientCanvas' : 'signatureProfessionalCanvas';
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (type === 'client' && signaturePadClient) {
                signaturePadClient.clear();
            } else if (type === 'professional' && signaturePadProfessional) {
                signaturePadProfessional.clear();
            }

            if (type === 'client') {
                currentAnamnese.assinaturaCliente = null;
            } else {
                currentAnamnese.assinaturaProfissional = null;
            }
        }

        // ============================================================
        // FOTOS
        // ============================================================
        function handleFotos(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            Swal.fire({
                title: 'Enviando fotos...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const uploadPromises = [];
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.match('image.*')) continue;
                uploadPromises.push(uploadImageToCloudinary(file));
            }

            Promise.all(uploadPromises)
                .then(urls => {
                    const fotos = urls.map(url => ({ url: url, data: new Date().toISOString() }));
                    if (!currentAnamnese.fotos) currentAnamnese.fotos = [];
                    currentAnamnese.fotos.push(...fotos);

                    const grid = document.getElementById('fichaPhotosGrid');
                    if (grid) {
                        fotos.forEach(foto => {
                            const div = document.createElement('div');
                            div.className = 'photo-item';
                            const index = currentAnamnese.fotos.length - 1;
                            div.innerHTML = `
                                <img src="${foto.url}" alt="Foto" onclick="visualizarFoto('${foto.url}')">
                                <button class="photo-remove" onclick="removerFoto(${index})">×</button>
                            `;
                            grid.appendChild(div);
                        });
                    }

                    Swal.close();
                    showSuccess(`${fotos.length} foto(s) adicionada(s) com sucesso!`);
                })
                .catch(error => {
                    Swal.close();
                    showError('Erro ao enviar fotos: ' + error.message);
                });

            event.target.value = '';
        }

        function removerFoto(index) {
            if (!currentAnamnese.fotos || index >= currentAnamnese.fotos.length) return;
            currentAnamnese.fotos.splice(index, 1);

            const grid = document.getElementById('fichaPhotosGrid');
            if (grid) {
                const items = grid.querySelectorAll('.photo-item');
                if (items[index]) items[index].remove();
            }
            showSuccess('Foto removida!');
        }

        function visualizarFoto(url) {
            Swal.fire({
                imageUrl: url,
                imageAlt: 'Foto',
                showCloseButton: true,
                showConfirmButton: false,
                width: '90%',
                imageWidth: '100%',
                imageHeight: 'auto',
                customClass: { image: 'img-fluid' }
            });
        }

        // ============================================================
        // SALVAR ANAMNESE
        // ============================================================
        function salvarAnamnese() {
            const respostas = {};
            
            document.querySelectorAll('[data-pergunta]:not(.checkbox-hidden)').forEach(el => {
                const perguntaId = el.getAttribute('data-pergunta');
                if (el.type === 'checkbox') return;
                respostas[perguntaId] = el.value || '';
            });

            document.querySelectorAll('.checkbox-hidden').forEach(el => {
                const perguntaId = el.getAttribute('data-pergunta');
                respostas[perguntaId] = el.value || '';
            });

            const consentimentoRGPD = document.getElementById('consentimentoRGPD')?.checked || false;

            let assinaturaCliente = null;
            let assinaturaProfissional = null;

            if (signaturePadClient && !signaturePadClient.isEmpty()) {
                assinaturaCliente = signaturePadClient.toDataURL('image/png');
            } else {
                const clientCanvas = document.getElementById('signatureClientCanvas');
                if (clientCanvas) {
                    const data = clientCanvas.toDataURL('image/png');
                    if (data && data.length > 1000) {
                        assinaturaCliente = data;
                    }
                }
            }

            if (signaturePadProfessional && !signaturePadProfessional.isEmpty()) {
                assinaturaProfissional = signaturePadProfessional.toDataURL('image/png');
            } else {
                const professionalCanvas = document.getElementById('signatureProfessionalCanvas');
                if (professionalCanvas) {
                    const data = professionalCanvas.toDataURL('image/png');
                    if (data && data.length > 1000) {
                        assinaturaProfissional = data;
                    }
                }
            }

            currentAnamnese.respostas = respostas;
            currentAnamnese.consentimentoRGPD = consentimentoRGPD;
            currentAnamnese.assinaturaCliente = assinaturaCliente;
            currentAnamnese.assinaturaProfissional = assinaturaProfissional;
            currentAnamnese.fotos = currentAnamnese.fotos || [];
            currentAnamnese.status = 'completa';
            currentAnamnese.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

            const missingFields = [];
            document.querySelectorAll('[data-pergunta][required]:not(.checkbox-hidden)').forEach(el => {
                if (!el.value || el.value.trim() === '') {
                    const label = el.closest('.form-group')?.querySelector('.form-label')?.textContent?.trim();
                    if (label) missingFields.push(label);
                }
            });
            document.querySelectorAll('.checkbox-hidden[required]').forEach(el => {
                if (!el.value || el.value.trim() === '') {
                    const label = el.closest('.form-group')?.querySelector('.form-label')?.textContent?.trim();
                    if (label) missingFields.push(label);
                }
            });

            if (missingFields.length > 0) {
                Swal.fire({
                    title: 'Campos obrigatórios',
                    text: `Preencha: ${missingFields.join(', ')}`,
                    icon: 'warning',
                    confirmButtonText: 'OK'
                });
                return;
            }

            if (!consentimentoRGPD) {
                Swal.fire({
                    title: 'Consentimento RGPD',
                    text: 'Aceite o consentimento RGPD antes de salvar.',
                    icon: 'warning',
                    confirmButtonText: 'OK'
                });
                return;
            }

            if (!assinaturaCliente) {
                Swal.fire({
                    title: 'Assinatura do Cliente',
                    text: 'Solicite a assinatura do cliente.',
                    icon: 'warning',
                    confirmButtonText: 'OK'
                });
                return;
            }

            if (!assinaturaProfissional) {
                Swal.fire({
                    title: 'Assinatura do Profissional',
                    text: 'Assine como profissional.',
                    icon: 'warning',
                    confirmButtonText: 'OK'
                });
                return;
            }

            Swal.fire({
                title: 'Salvando...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const anamneseId = currentAnamnese.id;
            if (!anamneseId) {
                Swal.close();
                showError('Erro: ID não encontrado.');
                return;
            }

            const saveData = {
                respostas: currentAnamnese.respostas,
                consentimentoRGPD: currentAnamnese.consentimentoRGPD,
                assinaturaCliente: currentAnamnese.assinaturaCliente,
                assinaturaProfissional: currentAnamnese.assinaturaProfissional,
                fotos: currentAnamnese.fotos,
                status: currentAnamnese.status,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('anamneses').doc(anamneseId).update(saveData)
                .then(() => {
                    Swal.close();
                    showSuccess('Anamnese salva com sucesso!');
                    carregarDados();
                    const index = anamneses.findIndex(a => a.id === anamneseId);
                    if (index !== -1) {
                        anamneses[index] = { ...anamneses[index], ...saveData };
                    }
                    renderizarCadastradas();
                })
                .catch(error => {
                    Swal.close();
                    showError('Erro ao salvar: ' + error.message);
                });
        }

        // ============================================================
        // ADICIONAR MAIS ANAMNESES
        // ============================================================
        function adicionarMaisAnamneses() {
            if (!currentAnamnese || !currentAnamnese.id) {
                showError('Abra uma anamnese cadastrada antes de adicionar outra ficha.');
                return;
            }

            const tiposAtuais = Array.isArray(currentAnamnese.tipos) ? currentAnamnese.tipos : [];
            const tiposDisponiveis = Object.keys(ANAMNESE_TYPES).filter(id => !tiposAtuais.includes(id));

            if (tiposDisponiveis.length === 0) {
                showError('Todas as anamneses já foram adicionadas a esta ficha.');
                return;
            }

            Swal.fire({
                title: 'Adicionar mais anamneses',
                html: `
                    <div class="text-start">
                        <p class="mb-3">Escolha uma ou mais fichas para anexar à anamnese já cadastrada:</p>
                        <div style="max-height:55vh;overflow-y:auto;">
                            ${tiposDisponiveis.map(id => {
                                const tipo = ANAMNESE_TYPES[id];
                                return `
                                    <label class="form-check d-flex align-items-center gap-2 p-2 mb-1" style="cursor:pointer;border:1px solid #eee;border-radius:10px;">
                                        <input class="form-check-input m-0" type="checkbox" name="tiposAdicionar" value="${id}">
                                        <i class="fas ${tipo.icone}" style="color:${tipo.cor || '#26196b'};width:22px;text-align:center;"></i>
                                        <span>${escaparHtml(tipo.nome)}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Adicionar fichas',
                cancelButtonText: 'Cancelar',
                width: 620,
                preConfirm: () => {
                    const selected = Array.from(document.querySelectorAll('input[name="tiposAdicionar"]:checked')).map(cb => cb.value);
                    if (!selected.length) {
                        Swal.showValidationMessage('Selecione pelo menos uma ficha.');
                        return null;
                    }
                    return selected;
                }
            }).then(result => {
                if (!result.isConfirmed || !result.value) return;

                const novosTipos = [...new Set([...tiposAtuais, ...result.value])];

                Swal.fire({
                    title: 'Salvando...',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });

                db.collection('anamneses').doc(currentAnamnese.id).update({
                    tipos: novosTipos,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    currentAnamnese.tipos = novosTipos;
                    const idx = anamneses.findIndex(a => a.id === currentAnamnese.id);
                    if (idx !== -1) anamneses[idx].tipos = novosTipos;
                    Swal.close();
                    anamneseModalInstance.hide();
                    setTimeout(() => abrirModalAnamnese(currentAnamnese), 250);
                    showSuccess('Novas fichas adicionadas à anamnese.');
                }).catch(error => {
                    Swal.close();
                    console.error('Erro ao adicionar anamneses:', error);
                    showError('Erro ao adicionar fichas: ' + error.message);
                });
            });
        }

        // ============================================================
        // GERAR PDF - COMPLETO E ALINHADO (SEM SOBREPOSIÇÃO)
        // ============================================================
        function criarPDFDocumento() {
            if (!currentAnamnese || !currentAnamnese.id) {
                showError('Salve a anamnese antes de gerar o PDF.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            const pageW = doc.internal.pageSize.getWidth();
            const pageH = doc.internal.pageSize.getHeight();
            const margin = 40;
            let y = margin;

            // Buscar dados do cliente
            let clienteData = null;
            if (currentAnamnese.clienteId) {
                const cliente = clients.find(c => c.id === currentAnamnese.clienteId);
                if (cliente) clienteData = cliente;
            }

            const clienteNome = clienteData?.name || currentAnamnese.clienteNome || 'Não informado';
            const clienteNascimento = clienteData?.nascimento || currentAnamnese.clienteNascimento || '';
            const clientePhone = clienteData?.phone || currentAnamnese.clientePhone || '';
            const clienteEmail = clienteData?.email || currentAnamnese.clienteEmail || '';
            const clientePhoto = clienteData?.photoUrl || currentAnamnese.clientePhoto || '';

            // ===== CABEÇALHO =====
            doc.setFontSize(22);
            doc.setTextColor(38, 25, 107);
            doc.setFont('helvetica', 'bold');
            doc.text('ANAMNESE', pageW / 2, y, { align: 'center' });
            y += 10;

            doc.setFontSize(10);
            doc.setTextColor(100, 100, 130);
            doc.setFont('helvetica', 'normal');
            doc.text('Studio DeVitto - Documento Clínico', pageW / 2, y, { align: 'center' });
            y += 16;

            doc.setDrawColor(38, 25, 107);
            doc.setLineWidth(1.5);
            doc.line(margin, y, pageW - margin, y);
            y += 18;

            // ===== DADOS DO CLIENTE =====
            doc.setFontSize(13);
            doc.setTextColor(38, 25, 107);
            doc.setFont('helvetica', 'bold');
            doc.text('DADOS DO CLIENTE', margin, y);
            y += 14;

            if (clientePhoto) {
                try {
                    doc.addImage(clientePhoto, 'JPEG', pageW - margin - 70, y - 10, 60, 60);
                } catch(e) {}
            }

            doc.setFontSize(10);
            doc.setTextColor(50, 50, 70);

            // FUNÇÃO PARA ESCREVER LABEL: VALOR NA MESMA LINHA
            function escreverLinha(label, valor, yPos) {
                // Label em negrito
                doc.setFont('helvetica', 'bold');
                const labelText = label + ':';
                doc.text(labelText, margin, yPos);
                
                // Calcular largura do label para posicionar o valor
                const labelWidth = doc.getTextWidth(labelText);
                const valorX = margin + labelWidth + 4;
                
                // Valor em normal
                doc.setFont('helvetica', 'normal');
                
                // Quebrar texto se necessário
                const maxWidth = pageW - valorX - margin - 20;
                const lines = doc.splitTextToSize(valor, maxWidth);
                doc.text(lines, valorX, yPos);
                
                return yPos + 14 * Math.max(1, lines.length);
            }

            y = escreverLinha('Nome', clienteNome, y);
            y = escreverLinha('Data de Nascimento', clienteNascimento ? formatDate(clienteNascimento) : 'Não informada', y);
            y = escreverLinha('Telefone', clientePhone || 'Não informado', y);
            y = escreverLinha('E-mail', clienteEmail || 'Não informado', y);
            y = escreverLinha('Profissional', currentAnamnese.profissionalNome || 'Não informado', y);
            y = escreverLinha('Data da Avaliação', currentAnamnese.data ? formatDate(currentAnamnese.data) : 'Não informada', y);

            y += 4;
            doc.setDrawColor(200, 200, 220);
            doc.setLineWidth(0.5);
            doc.line(margin, y, pageW - margin, y);
            y += 16;

            // ===== AVALIAÇÕES =====
            const tipos = currentAnamnese.tipos || [];

            if (tipos.length === 0) {
                doc.setFontSize(11);
                doc.setTextColor(150, 150, 170);
                doc.text('Nenhuma avaliação registrada.', margin, y);
                y += 20;
            }

            tipos.forEach((tipoId, index) => {
                const tipo = ANAMNESE_TYPES[tipoId];
                if (!tipo) return;

                // Verificar espaço
                const estimatedHeight = 40 + (tipo.perguntas.length * 18);
                if (y + estimatedHeight > pageH - margin) {
                    doc.addPage();
                    y = margin + 20;
                }

                doc.setFontSize(14);
                doc.setTextColor(tipo.cor || '#26196b');
                doc.setFont('helvetica', 'bold');
                doc.text(`${index + 1}. ${tipo.nome}`, margin, y);
                y += 14;

                doc.setFontSize(9.5);
                doc.setTextColor(50, 50, 70);

                // FUNÇÃO PARA ESCREVER PERGUNTA: RESPOSTA NA MESMA LINHA
                function escreverPergunta(pergunta, resposta, yPos) {
                    const perguntaText = pergunta + ':';
                    const perguntaX = margin + 8;
                    const maxLineWidth = pageW - margin * 2 - 16;

                    doc.setFont('helvetica', 'bold');
                    const perguntaWidth = doc.getTextWidth(perguntaText);
                    const respostaX = perguntaX + perguntaWidth + 5;

                    // Se a pergunta ocupar quase toda a linha, a resposta começa na linha seguinte.
                    if (respostaX > pageW - margin - 90) {
                        const perguntaLines = doc.splitTextToSize(perguntaText, maxLineWidth);
                        doc.text(perguntaLines, perguntaX, yPos);
                        yPos += 12 * perguntaLines.length;
                        doc.setFont('helvetica', 'normal');
                        const respostaLines = doc.splitTextToSize(String(resposta || '-'), maxLineWidth);
                        doc.text(respostaLines, perguntaX, yPos);
                        return yPos + 12 * Math.max(1, respostaLines.length) + 2;
                    }

                    doc.text(perguntaText, perguntaX, yPos);
                    doc.setFont('helvetica', 'normal');
                    const maxWidth = Math.max(80, pageW - respostaX - margin - 10);
                    const respostaLines = doc.splitTextToSize(String(resposta || '-'), maxWidth);
                    doc.text(respostaLines, respostaX, yPos);
                    return yPos + 12 * Math.max(1, respostaLines.length);
                }

                tipo.perguntas.forEach(p => {
                    let resposta = currentAnamnese.respostas ? currentAnamnese.respostas[p.id] || '-' : '-';
                    if (Array.isArray(resposta)) resposta = resposta.join(', ');
                    resposta = String(resposta);

                    if (y > pageH - margin - 45) {
                        doc.addPage();
                        y = margin + 20;
                    }
                    y = escreverPergunta(p.label, resposta, y);
                });

                y += 8;
                doc.setDrawColor(220, 220, 235);
                doc.setLineWidth(0.3);
                doc.line(margin + 8, y, pageW - margin - 8, y);
                y += 14;
            });

            // ===== FOTOS =====
            if (currentAnamnese.fotos && currentAnamnese.fotos.length > 0) {
                doc.addPage();
                y = margin + 20;
                doc.setFontSize(14);
                doc.setTextColor(38, 25, 107);
                doc.setFont('helvetica', 'bold');
                doc.text('REGISTRO FOTOGRÁFICO', pageW / 2, y, { align: 'center' });
                y += 18;
                doc.setFont('helvetica', 'normal');

                const fotos = currentAnamnese.fotos;
                const maxPerRow = 2;
                const imgWidth = 150;
                const imgHeight = 150;
                const spacing = 20;

                for (let i = 0; i < Math.min(fotos.length, 8); i++) {
                    const row = Math.floor(i / maxPerRow);
                    const col = i % maxPerRow;
                    const x = margin + col * (imgWidth + spacing);
                    const yPos = y + row * (imgHeight + spacing);
                    
                    if (yPos + imgHeight > pageH - margin) {
                        doc.addPage();
                        y = margin + 20;
                        const newRow = 0;
                        const newCol = i % maxPerRow;
                        const newX = margin + newCol * (imgWidth + spacing);
                        const newY = y + newRow * (imgHeight + spacing);
                        try {
                            doc.addImage(fotos[i].url, 'JPEG', newX, newY, imgWidth, imgHeight);
                        } catch(e) {}
                    } else {
                        try {
                            doc.addImage(fotos[i].url, 'JPEG', x, yPos, imgWidth, imgHeight);
                        } catch(e) {}
                    }
                }
                y += Math.ceil(Math.min(fotos.length, 8) / maxPerRow) * (imgHeight + spacing) + 20;
            }

            // ===== ASSINATURAS =====
            doc.addPage();
            y = margin + 20;
            doc.setFontSize(14);
            doc.setTextColor(38, 25, 107);
            doc.setFont('helvetica', 'bold');
            doc.text('ASSINATURAS', pageW / 2, y, { align: 'center' });
            y += 20;
            doc.setFont('helvetica', 'normal');

            doc.setFontSize(11);
            doc.setTextColor(50, 50, 70);
            doc.setFont('helvetica', 'bold');
            doc.text('Assinatura do Cliente:', margin, y);
            y += 14;
            doc.setFont('helvetica', 'normal');

            if (currentAnamnese.assinaturaCliente) {
                try {
                    doc.addImage(currentAnamnese.assinaturaCliente, 'PNG', margin, y, 220, 55);
                    y += 65;
                } catch(e) {
                    doc.text('________________________________________', margin, y);
                    y += 16;
                    doc.text('(Assinatura digital registrada)', margin, y);
                    y += 16;
                }
            } else {
                doc.text('________________________________________', margin, y);
                y += 16;
                doc.text('(Cliente não assinou)', margin, y);
                y += 16;
            }

            y += 10;

            doc.setFont('helvetica', 'bold');
            doc.text('Assinatura do Profissional:', margin, y);
            y += 14;
            doc.setFont('helvetica', 'normal');

            if (currentAnamnese.assinaturaProfissional) {
                try {
                    doc.addImage(currentAnamnese.assinaturaProfissional, 'PNG', margin, y, 220, 55);
                    y += 65;
                } catch(e) {
                    doc.text('________________________________________', margin, y);
                    y += 16;
                    doc.text('(Assinatura digital registrada)', margin, y);
                    y += 16;
                }
            } else {
                doc.text('________________________________________', margin, y);
                y += 16;
                doc.text('(Profissional não assinou)', margin, y);
                y += 16;
            }

            y += 20;

            // ===== RGPD =====
            doc.setFontSize(9);
            doc.setTextColor(80, 80, 100);
            doc.setFont('helvetica', 'normal');
            const rgpdText = currentAnamnese.consentimentoRGPD ? 
                '☑ Consentimento RGPD: Aceito' : 
                '☐ Consentimento RGPD: Não aceito';
            doc.text(rgpdText, margin, y);
            y += 14;

            // ===== CUIDADOS PÓS-DEPILAÇÃO =====
            const temDepilacao = currentAnamnese.tipos && currentAnamnese.tipos.includes('depilacao');
            if (temDepilacao) {
                const tipoDepilacao = ANAMNESE_TYPES['depilacao'];
                if (tipoDepilacao && tipoDepilacao.cuidados) {
                    if (y + (tipoDepilacao.cuidados.length * 14) + 30 > pageH - margin) {
                        doc.addPage();
                        y = margin + 20;
                    }
                    
                    doc.setFontSize(11);
                    doc.setTextColor(200, 100, 50);
                    doc.setFont('helvetica', 'bold');
                    doc.text('CUIDADOS PÓS-DEPILAÇÃO A LASER', margin, y);
                    y += 14;
                    
                    doc.setFontSize(8.5);
                    doc.setTextColor(80, 60, 40);
                    doc.setFont('helvetica', 'normal');
                    
                    tipoDepilacao.cuidados.forEach((cuidado, idx) => {
                        doc.text(`${idx+1}. ${cuidado}`, margin + 8, y);
                        y += 12;
                    });
                    y += 10;
                }
            }

            // ===== RODAPÉ =====
            y = pageH - 30;
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 170);
            doc.setFont('helvetica', 'italic');
            const rodape = `Documento gerado por Studio DeVitto em ${new Date().toLocaleDateString('pt-PT')} às ${new Date().toLocaleTimeString('pt-PT')}`;
            doc.text(rodape, pageW / 2, y, { align: 'center' });

            const nomeCliente = clienteNome.replace(/\s/g, '_').substring(0, 30);
            return doc;
        }

        function gerarPDF() {
            if (!currentAnamnese || !currentAnamnese.id) {
                showError('Salve a anamnese antes de gerar o PDF.');
                return;
            }

            const doc = criarPDFDocumento();
            const clienteData = currentAnamnese.clienteId ? clients.find(c => c.id === currentAnamnese.clienteId) : null;
            const clienteNome = clienteData?.name || currentAnamnese.clienteNome || 'Não informado';
            const nomeCliente = clienteNome.replace(/[^a-zA-Z0-9À-ÿ _-]/g, '').replace(/\s+/g, '_').substring(0, 30) || 'Cliente';
            doc.save(`Anamnese_${nomeCliente}_${new Date().toISOString().slice(0,10)}.pdf`);
            showSuccess('PDF gerado com sucesso!');
        }

        // ============================================================
        // COMPARTILHAR PDF
        // ============================================================
        async function compartilhar() {
            if (!currentAnamnese || !currentAnamnese.id) {
                showError('Salve antes de compartilhar.');
                return;
            }

            try {
                const pdfData = criarPDFDocumento();
                const clienteData = currentAnamnese.clienteId ? clients.find(c => c.id === currentAnamnese.clienteId) : null;
                const clienteNome = clienteData?.name || currentAnamnese.clienteNome || 'Cliente';
                const nomeSeguro = clienteNome.replace(/[^a-zA-Z0-9À-ÿ _-]/g, '').replace(/\s+/g, '_').substring(0, 50) || 'Cliente';
                const filename = `Anamnese_${nomeSeguro}_${new Date().toISOString().slice(0,10)}.pdf`;
                const blob = pdfData.output('blob');
                const file = new File([blob], filename, { type: 'application/pdf' });

                const texto = `Anamnese - ${clienteNome}`;

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: texto,
                        text: 'Segue a anamnese em PDF.',
                        files: [file]
                    });
                    return;
                }

                // Navegadores sem compartilhamento de arquivos: baixa o PDF e tenta abrir a tela de compartilhamento.
                pdfData.save(filename);

                if (navigator.share) {
                    await navigator.share({ title: texto, text: 'Segue a anamnese em PDF.' }).catch(() => {});
                } else {
                    showSuccess('PDF gerado. O navegador não permite anexar arquivos diretamente pelo compartilhamento.');
                }
            } catch (error) {
                if (error && error.name === 'AbortError') return;
                console.error('Erro ao compartilhar PDF:', error);
                showError('Não foi possível compartilhar o PDF: ' + (error.message || 'erro desconhecido'));
            }
        }

        }

        function renderizarCadastradas() {
            const container = document.getElementById('cadastradasList');
            const searchTerm = document.getElementById('searchCadastrada')?.value.toLowerCase().trim() || '';

            let filtered = anamneses;
            if (searchTerm) {
                filtered = filtered.filter(a => 
                    (a.clienteNome || '').toLowerCase().includes(searchTerm) ||
                    (a.tipos || []).some(t => (ANAMNESE_TYPES[t]?.nome || '').toLowerCase().includes(searchTerm)) ||
                    (a.profissionalNome || '').toLowerCase().includes(searchTerm)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-notes-medical fa-4x mb-3 opacity-25" style="color:#8a84a0;"></i>
                        <h5 class="text-muted">Nenhuma anamnese cadastrada</h5>
                        <p class="text-muted small">Clique em "Nova Anamnese" para começar.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(anamnese => {
                const tipos = (anamnese.tipos || []).map(id => ANAMNESE_TYPES[id]?.nome || id).join(', ');
                const status = anamnese.status === 'completa' ? 'completed' : 'pending';
                const statusLabel = anamnese.status === 'completa' ? '✅ Completa' : '⏳ Pendente';
                const dataCriacao = anamnese.createdAt ? new Date(anamnese.createdAt).toLocaleDateString('pt-PT') : 'Data desconhecida';

                const cores = ['#d63384', '#0d6efd', '#198754', '#fd7e14', '#dc3545', '#6f42c1', '#e83e8c', '#8b4513', '#20c997', '#e83e8c'];
                const cor = cores[anamnese.tipos?.length % cores.length] || '#26196b';

                html += `
                    <div class="ficha-list-item">
                        <div class="ficha-icon" style="background:${cor};">
                            <i class="fas fa-notes-medical"></i>
                        </div>
                        <div class="ficha-info" onclick="abrirAnamneseExistente('${anamnese.id}')">
                            <div class="ficha-name">${anamnese.clienteNome || 'Cliente não informado'}</div>
                            <div class="ficha-meta">
                                <i class="fas fa-user-tie me-1"></i>${anamnese.profissionalNome || 'Profissional'} |
                                <i class="fas fa-calendar me-1"></i>${dataCriacao} |
                                📂 ${tipos || 'Sem anamneses'}
                            </div>
                        </div>
                        <span class="ficha-status ${status}">${statusLabel}</span>
                        <div class="ficha-actions">
                            <button class="btn-icon" onclick="event.stopPropagation(); editarAnamnese('${anamnese.id}')" title="Editar">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-icon" onclick="event.stopPropagation(); excluirAnamnese('${anamnese.id}')" title="Excluir" style="color:#dc3545;">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function filtrarCadastradas() {
            renderizarCadastradas();
        }

        // ============================================================
        // ABRIR ANAMNESE EXISTENTE
        // ============================================================
        function abrirAnamneseExistente(anamneseId) {
            const anamnese = anamneses.find(a => a.id === anamneseId);
            if (!anamnese) {
                showError('Anamnese não encontrada.');
                return;
            }

            currentAnamnese = { ...anamnese };
            isEditing = true;
            cadastradasModalInstance.hide();
            setTimeout(() => {
                abrirModalAnamnese(currentAnamnese);
            }, 300);

        }

        // ============================================================
        // EXCLUIR ANAMNESE
        // ============================================================
        function excluirAnamnese(anamneseId) {
            Swal.fire({
                title: 'Confirmar exclusão',
                text: 'Tem certeza que deseja excluir esta anamnese? Esta ação não pode ser desfeita.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sim, excluir',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#dc3545'
            }).then(result => {
                if (result.isConfirmed) {
                    db.collection('anamneses').doc(anamneseId).delete()
                        .then(() => {
                            anamneses = anamneses.filter(a => a.id !== anamneseId);
                            showSuccess('Anamnese excluída com sucesso!');
                            renderizarCadastradas();
                            carregarDados();
                        })
                        .catch(error => {
                            showError('Erro ao excluir: ' + error.message);
                        });
                }
            });
        }

        // ============================================================
        // UPLOAD IMAGE
        // ============================================================
        function uploadImageToCloudinary(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', cloudinaryConfig.uploadPreset);

                fetch(`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.secure_url) {
                        resolve(data.secure_url);
                    } else {
                        reject('Erro no upload: ' + JSON.stringify(data));
                    }
                })
                .catch(error => reject(error));
            });
        }

        function formatDate(date) {
            if (!date) return '';
            if (typeof date === 'string') date = new Date(date);
            return date.toLocaleDateString('pt-PT');
        }
